<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<title>字幕コラボ</title>



<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>



<style>

body {

&#x20; background:#111;

&#x20; color:white;

&#x20; font-family:Meiryo, monospace;

}



.fixed {

&#x20; width:496px;

&#x20; font-family:Consolas, monospace;

&#x20; font-size:24px;

&#x20; line-height:34px;

&#x20; box-sizing:border-box;

}

</style>

</head>



<body>



<div id="role-select">

&#x20; <h2>担当を選択</h2>

&#x20; <button id="btnA">A</button>

&#x20; <button id="btnB">B</button>

&#x20; <button id="btnC">C</button>

</div>



<div id="app" style="display:none"></div>



<script>



// =====================

let socket;

let isConnected = false;

let myRole = null;



let inputs = {

&#x20; A:"",

&#x20; B:"",

&#x20; C:""

};



let active = null;



let connectedRoles = {

&#x20; A:false,

&#x20; B:false,

&#x20; C:false

};



let log = \[];



// IME変換中か判定

let isComposing = false;



// =====================

window.addEventListener("DOMContentLoaded", init);



function init() {

&#x20; bindRoleButtons();

&#x20; bindGlobalKeys();

}



// =====================

function bindRoleButtons() {



&#x20; document.getElementById("btnA").onclick = () => startApp("A");

&#x20; document.getElementById("btnB").onclick = () => startApp("B");

&#x20; document.getElementById("btnC").onclick = () => startApp("C");

}



// =====================

function startApp(role) {



&#x20; myRole = role;



&#x20; document.getElementById("role-select").style.display = "none";

&#x20; document.getElementById("app").style.display = "block";



&#x20; createLayout();

&#x20; createInputs();

&#x20; setGuideLine();

&#x20; connectSocket();

}



// =====================

function createLayout() {



&#x20; document.getElementById("app").innerHTML = `

&#x20;   <div style="display:flex; gap:20px;">



&#x20;     <div id="columns"></div>



&#x20;     <div>

&#x20;       <h3>ログ</h3>



&#x20;       <div id="log" class="fixed" style="

&#x20;         height:400px;

&#x20;         overflow-y:scroll;

&#x20;         border:1px solid white;

&#x20;         padding:4px;

&#x20;         white-space:pre-wrap;

&#x20;         overflow-wrap:anywhere;

&#x20;       "></div>

&#x20;     </div>



&#x20;     <div>

&#x20;       <h3>検索</h3>



&#x20;       <iframe

&#x20;         id="searchFrame"

&#x20;         style="

&#x20;           width:600px;

&#x20;           height:400px;

&#x20;           border:1px solid white;

&#x20;         ">

&#x20;       </iframe>

&#x20;     </div>



&#x20;   </div>

&#x20; `;

}



// =====================

function getOrder() {



&#x20; if (myRole === "A") return \["C","A","B"];

&#x20; if (myRole === "B") return \["A","B","C"];

&#x20; if (myRole === "C") return \["B","C","A"];



&#x20; return \["A","B","C"];

}



// =====================

function createInputs() {



&#x20; const columns = document.getElementById("columns");



&#x20; columns.innerHTML = getOrder().map(k => `

&#x20;   <div style="

&#x20;     display:flex;

&#x20;     gap:10px;

&#x20;     margin-bottom:20px;

&#x20;   ">



&#x20;     <div

&#x20;       id="label-${k}"

&#x20;       style="

&#x20;         width:40px;

&#x20;         height:180px;

&#x20;         display:flex;

&#x20;         align-items:center;

&#x20;         justify-content:center;

&#x20;         background:#555;

&#x20;         color:white;

&#x20;       ">

&#x20;     </div>



&#x20;     <textarea id="input-${k}" class="fixed" style="height:180px;"></textarea>



&#x20;   </div>

&#x20; `).join("");



&#x20; \["A","B","C"].forEach(k => {



&#x20;   const input = document.getElementById("input-" + k);



&#x20;   input.oncompositionstart = () => {



&#x20;     if (k === myRole) {

&#x20;       isComposing = true;

&#x20;     }

&#x20;   };



&#x20;   input.oncompositionend = () => {



&#x20;     if (k === myRole) {

&#x20;       setTimeout(() => {

&#x20;         isComposing = false;

&#x20;         updateUI();

&#x20;       }, 0);

&#x20;     }

&#x20;   };



&#x20;   input.oninput = e => {



&#x20;     inputs\[k] = e.target.value;



&#x20;     if (socket \&\& isConnected) {



&#x20;       socket.emit("typing", {

&#x20;         key:k,

&#x20;         value:e.target.value

&#x20;       });

&#x20;     }

&#x20;   };

&#x20; });



&#x20; updateUI();

}



// =====================

function setGuideLine() {



&#x20; const span = document.createElement("span");



&#x20; span.style.font = "24px Consolas";

&#x20; span.innerText = "あ".repeat(15.5);



&#x20; document.body.appendChild(span);



&#x20; const w = span.getBoundingClientRect().width;



&#x20; document.body.removeChild(span);



&#x20; document.querySelectorAll("textarea").forEach(el => {



&#x20;   el.style.backgroundImage = `

&#x20;     linear-gradient(

&#x20;       to right,

&#x20;       transparent ${w}px,

&#x20;       red ${w}px,

&#x20;       red ${w + 1}px,

&#x20;       transparent ${w + 1}px

&#x20;     )

&#x20;   `;

&#x20; });

}



// =====================

function connectSocket() {



&#x20; socket = io("https://subtitle-server-czoz.onrender.com");



&#x20; // =====================

&#x20; socket.on("connect", () => {



&#x20;   isConnected = true;



&#x20;   socket.emit("register", {

&#x20;     key:myRole

&#x20;   });

&#x20; });



&#x20; // =====================

&#x20; socket.on("disconnect", () => {



&#x20;   isConnected = false;



&#x20;   if (myRole) {

&#x20;     connectedRoles\[myRole] = false;

&#x20;   }



&#x20;   updateUI();

&#x20; });



&#x20; // =====================

&#x20; socket.on("presence", presence => {



&#x20;   connectedRoles = {

&#x20;     A:!!presence.A,

&#x20;     B:!!presence.B,

&#x20;     C:!!presence.C

&#x20;   };



&#x20;   // 未接続になった他担当の古い入力内容を消す

&#x20;   \["A","B","C"].forEach(k => {



&#x20;     if (k !== myRole \&\& !connectedRoles\[k]) {

&#x20;       inputs\[k] = "";

&#x20;     }

&#x20;   });



&#x20;   updateUI();

&#x20; });



&#x20; // =====================

&#x20; socket.on("typing", ({key,value}) => {



&#x20;   inputs\[key] = value;



&#x20;   updateUI();

&#x20; });



&#x20; // =====================

&#x20; socket.on("log", data => {



&#x20;   log.push(data);



&#x20;   updateUI();

&#x20; });



&#x20; // =====================

&#x20; socket.on("active", next => {



&#x20;   active = next;



&#x20;   updateUI();

&#x20; });

}



// =====================

function updateUI() {



&#x20; // IMEの最終置換が完了するまで画面を書き換えない

&#x20; if (isComposing) {

&#x20;   return;

&#x20; }



&#x20; \["A","B","C"].forEach(k => {



&#x20;   const label = document.getElementById("label-" + k);

&#x20;   const input = document.getElementById("input-" + k);



&#x20;   if (!label || !input) {

&#x20;     return;

&#x20;   }



&#x20;   const online = connectedRoles\[k];



&#x20;   // =====================

&#x20;   // 担当ラベル

&#x20;   label.textContent = k;



&#x20;   if (!online) {



&#x20;     // 未接続

&#x20;     label.style.background = "#333";

&#x20;     label.style.color = "#777";

&#x20;     label.title = "未接続";



&#x20;   } else if (active === k) {



&#x20;     // 現在の送信担当

&#x20;     label.style.background = "#0a0";

&#x20;     label.style.color = "white";

&#x20;     label.title = "送信担当";



&#x20;   } else {



&#x20;     // 接続中

&#x20;     label.style.background = "#555";

&#x20;     label.style.color = "white";

&#x20;     label.title = "接続中";

&#x20;   }



&#x20;   // =====================

&#x20;   // 入力欄



&#x20;   input.readOnly = (

&#x20;     myRole !== k ||

&#x20;     !online

&#x20;   );



&#x20;   if (!online) {



&#x20;     input.style.backgroundColor = "#2a2a2a";

&#x20;     input.style.color = "#777";

&#x20;     input.style.borderColor = "#444";



&#x20;     input.placeholder = "未接続";



&#x20;   } else {



&#x20;     input.style.backgroundColor = "";

&#x20;     input.style.color = "";

&#x20;     input.style.borderColor = "";



&#x20;     input.placeholder = "";

&#x20;   }



&#x20;   // 自分以外の入力欄だけ同期

&#x20;   if (k !== myRole) {

&#x20;     input.value = inputs\[k] || "";

&#x20;   }

&#x20; });



&#x20; // =====================

&#x20; // ログ



&#x20; const logEl = document.getElementById("log");



&#x20; if (logEl) {



&#x20;   logEl.textContent =

&#x20;     log

&#x20;       .map(l =>

&#x20;         String(l.text || "")

&#x20;           .replace(/。/g,"｡")

&#x20;       )

&#x20;       .join("\\n");



&#x20;   logEl.scrollTop = logEl.scrollHeight;

&#x20; }

}



// =====================

function send() {



&#x20; if (!isConnected) {

&#x20;   return;

&#x20; }



&#x20; if (!myRole) {

&#x20;   return;

&#x20; }



&#x20; if (!connectedRoles\[myRole]) {

&#x20;   return;

&#x20; }



&#x20; if (active !== myRole) {

&#x20;   return;

&#x20; }



&#x20; const text = inputs\[myRole] || "";



&#x20; inputs\[myRole] = "";



&#x20; document.getElementById(

&#x20;   "input-" + myRole

&#x20; ).value = "";



&#x20; socket.emit("send", {

&#x20;   key:myRole,

&#x20;   text

&#x20; });



&#x20; socket.emit("typing", {

&#x20;   key:myRole,

&#x20;   value:""

&#x20; });



&#x20; updateUI();

}



// =====================

function bindGlobalKeys() {



&#x20; document.addEventListener(

&#x20;   "keydown",

&#x20;   handleKey

&#x20; );

}



// =====================

function handleKey(e) {



&#x20; // =====================

&#x20; // F12送信



&#x20; if (e.key === "F12") {



&#x20;   e.preventDefault();



&#x20;   if (

&#x20;     myRole \&\&

&#x20;     active === myRole

&#x20;   ) {

&#x20;     send();

&#x20;   }

&#x20; }



&#x20; // =====================

&#x20; // F4検索



&#x20; if (e.key === "F4") {



&#x20;   e.preventDefault();



&#x20;   const input =

&#x20;     document.getElementById(

&#x20;       "input-" + myRole

&#x20;     );



&#x20;   const frame =

&#x20;     document.getElementById(

&#x20;       "searchFrame"

&#x20;     );



&#x20;   if (!input || !frame) {

&#x20;     return;

&#x20;   }



&#x20;   const text =

&#x20;     input.value.substring(

&#x20;       input.selectionStart,

&#x20;       input.selectionEnd

&#x20;     );



&#x20;   if (!text) {

&#x20;     return;

&#x20;   }



&#x20;   frame.src =

&#x20;     "https://www.bing.com/search?q=" +

&#x20;     encodeURIComponent(text);

&#x20; }

}



</script>



</body>

</html>
