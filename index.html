<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>字幕コラボ</title>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<style>
body {
  background:#111;
  color:white;
  font-family:Meiryo, monospace;
}

/* ✅ 完全一致設定 */
.fixed-text {
  width:496px;              /* ←ここ固定（最重要） */
  font-family:Consolas, monospace;
  font-size:24px;
  line-height:34px;
  letter-spacing:0;
}

/* ✅ 縦線 */
.guide-line {
  background-image:
    linear-gradient(
      to right,
      transparent 0,
      transparent 465px,
      red 465px,
      red 466px,
      transparent 466px
    );
}
</style>

</head>

<body>

<div id="role-select">
  <h2>担当を選択</h2>
  <button id="btnA">A</button>
  <button id="btnB">B</button>
  <button id="btnC">C</button>
</div>

<div id="app" style="display:none"></div>

<script>

let socket;
let isConnected = false;
let inputs = { A:"", B:"", C:"" };
let active = "A";
let log = [];
let myRole = null;

// ----------------
// 初期化
// ----------------
window.addEventListener("DOMContentLoaded", () => {

  document.getElementById("btnA").onclick = () => selectRole("A");
  document.getElementById("btnB").onclick = () => selectRole("B");
  document.getElementById("btnC").onclick = () => selectRole("C");

});

// ----------------
// 選択
// ----------------
function selectRole(role) {
  myRole = role;
  document.getElementById("role-select").style.display = "none";
  document.getElementById("app").style.display = "block";
  initUI();
  connectSocket();
}

// ----------------
// socket
// ----------------
function connectSocket() {

  socket = io("https://subtitle-server-czoz.onrender.com");

  socket.on("connect", () => isConnected = true);
  socket.on("disconnect", () => isConnected = false);

  socket.on("typing", ({ key, value }) => {
    inputs[key] = value;
    updateUI();
  });

  socket.on("log", (data) => {
    log.push(data);
    updateUI();
  });

  socket.on("active", (next) => {
    active = next;
    updateUI();
  });
}

// ----------------
// 並び
// ----------------
function getOrder() {
  if (myRole === "A") return ["C","A","B"];
  if (myRole === "B") return ["A","B","C"];
  if (myRole === "C") return ["B","C","A"];
  return ["A","B","C"];
}

// ----------------
// ✅ 完全15.5文字制御
// ----------------
function formatLogText(text) {

  const MAX = 31;

  let result = "";
  let line = "";
  let count = 0;

  for (let i = 0; i < text.length; i++) {

    let char = text[i];

    let width = char.match(/[ -~]/) ? 1 : 2;

    if (char === "。" && count === 30) {
      width = 1;
    }

    if (count + width > MAX) {
      result += line + "\n";
      line = "";
      count = 0;
    }

    line += char;
    count += width;

    if (count === MAX) {
      result += line + "\n";
      line = "";
      count = 0;
    }
  }

  result += line;

  return result;
}

// ----------------
// UI
// ----------------
function initUI() {

  const app = document.getElementById("app");

  app.innerHTML = `
    <div style="display:flex; gap:20px;">

      <div id="columns"></div>

      <div>
        <h3>ログ</h3>
        <div id="log" class="fixed-text" style="
          height:400px;
          overflow-y:scroll;
          border:1px solid white;
          padding:4px;
          white-space:pre;
        "></div>
      </div>

    </div>
  `;

  const columns = document.getElementById("columns");

  columns.innerHTML =
    getOrder().map(k => `
      <div style="display:flex; gap:10px; margin-bottom:20px;">

        <div id="label-${k}" style="
          width:40px;height:180px;
          display:flex;align-items:center;justify-content:center;
          border-radius:6px;background:#555;color:#fff;">
        </div>

        <textarea
          id="input-${k}"
          class="fixed-text guide-line"
          style="
            height:180px;
          "
        ></textarea>

      </div>
    `).join("");

  ["A","B","C"].forEach(k => {
    document.getElementById("input-" + k).oninput = e => {
      inputs[k] = e.target.value;
      if (socket && isConnected) {
        socket.emit("typing", { key:k, value:e.target.value });
      }
    };
  });

  updateUI();
}

// ----------------
// UI更新
// ----------------
function updateUI() {

  ["A","B","C"].forEach(k => {

    const label = document.getElementById("label-" + k);
    const input = document.getElementById("input-" + k);

    label.textContent = k;

    label.style.background =
      active === k ? "#00aa00" : "#555";

    input.readOnly = myRole !== k;

    if (k !== myRole) input.value = inputs[k] || "";
  });

  const logEl = document.getElementById("log");

  logEl.textContent =
    log.map(l => formatLogText(l.text)).join("\n");

  logEl.scrollTop = logEl.scrollHeight;
}

// ----------------
// 送信
// ----------------
function send(key) {

  if (!isConnected) return;

  const text = inputs[key] || "";

  inputs[key] = "";
  document.getElementById("input-" + key).value = "";

  socket.emit("send", { key, text });
  socket.emit("typing", { key, value:"" });

  updateUI();
}

// ----------------
// F12
// ----------------
document.addEventListener("keydown", e => {
  if (e.key === "F12") {
    e.preventDefault();
    if (myRole && active === myRole) send(myRole);
  }
});

</script>
</body>
</html>
