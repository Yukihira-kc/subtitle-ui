<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字幕コラボ</title>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<style>
*,
*::before,
*::after {
  box-sizing:border-box;
}

html {
  width:100%;
  height:100%;
  overflow:hidden;
}

body {
  --page-bg:#111;
  --page-text:#fff;
  --border:#fff;
  --offline-bg:#2a2a2a;
  --offline-text:#777;
  --offline-border:#444;
  --label-offline-bg:#333;
  --label-bg:#555;
  --label-text:#fff;

  margin:0;
  padding:8px;
  width:100%;
  height:100vh;
  height:100dvh;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:8px;
  overflow:hidden;
  background:var(--page-bg);
  color:var(--page-text);
  font-family:Meiryo, monospace;
}

body.light-theme {
  --page-bg:#fff;
  --page-text:#000;
  --border:#555;
  --offline-bg:#eee;
  --offline-text:#666;
  --offline-border:#bbb;
  --label-offline-bg:#ddd;
  --label-bg:#ddd;
  --label-text:#000;
}

textarea,
button {
  background-color:var(--page-bg);
  color:var(--page-text);
  border:1px solid var(--border);
}

button {
  font:inherit;
  cursor:pointer;
}

#toolbar {
  flex:0 0 auto;
}

#theme-toggle {
  padding:6px 12px;
}

#role-select {
  min-height:0;
  overflow:auto;
}

#role-select h2 {
  margin:8px 0;
}

#role-select button {
  padding:8px 18px;
}

#app {
  display:none;
  flex:1 1 0;
  width:100%;
  min-width:0;
  min-height:0;
  overflow:hidden;
}

#workspace {
  display:grid;
  grid-template-columns:
    minmax(0,1.15fr)
    minmax(0,1fr)
    minmax(0,1fr);
  grid-template-rows:minmax(0,1fr);
  gap:10px;
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  overflow:hidden;
}

#workspace > section {
  min-width:0;
  min-height:0;
  overflow:hidden;
}

#columns {
  display:grid;
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:repeat(3,minmax(0,1fr));
  gap:10px;
}

.input-row {
  display:grid;
  grid-template-columns:32px minmax(0,1fr);
  grid-template-rows:minmax(0,1fr);
  gap:6px;
  min-width:0;
  min-height:0;
  overflow:hidden;
}

.role-label {
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
  min-height:0;
  background:var(--label-bg);
  color:var(--label-text);
}

.fixed {
  font-family:Consolas, monospace;
  font-size:24px;
  line-height:34px;
}

.input-row textarea {
  display:block;
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  margin:0;
  padding:4px;
  resize:none;
  overflow-x:hidden;
  overflow-y:scroll;
  scrollbar-gutter:stable;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

#log-panel,
#search-panel {
  display:flex;
  flex-direction:column;
  gap:8px;
}

#log-panel h3,
#search-panel h3 {
  flex:0 0 auto;
  margin:0;
  font-size:16px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

#log {
  flex:1 1 0;
  width:100%;
  min-width:0;
  min-height:0;
  padding:4px;
  border:1px solid var(--border);
  overflow-x:hidden;
  overflow-y:scroll;
  scrollbar-gutter:stable;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

/*
  iframe自身の枠線もwidth:100%に含める。
  検索ページのスクロールバーはiframeの内側に表示する。
*/
#searchFrame {
  display:block;
  flex:1 1 0;
  width:100%;
  min-width:0;
  min-height:0;
  height:0;
  margin:0;
  border:1px solid var(--border);
}

@media (max-width:1100px) {
  #workspace {
    gap:6px;
  }

  .input-row {
    grid-template-columns:26px minmax(0,1fr);
    gap:4px;
  }

  #columns {
    gap:6px;
  }

  #log-panel h3,
  #search-panel h3 {
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="toolbar">
  <button
    id="theme-toggle"
    type="button"
    aria-pressed="false"
  >白背景に切替</button>
</div>

<div id="role-select">
  <h2>担当を選択</h2>
  <button id="btnA" type="button">A</button>
  <button id="btnB" type="button">B</button>
  <button id="btnC" type="button">C</button>
</div>

<div id="app"></div>

<script>
let socket;
let isConnected = false;
let myRole = null;

let inputs = {
  A:"",
  B:"",
  C:""
};

let active = null;

let connectedRoles = {
  A:false,
  B:false,
  C:false
};

let log = [];

window.addEventListener("DOMContentLoaded", init);

function init() {
  initTheme();
  bindRoleButtons();
  bindGlobalKeys();
}

function initTheme() {
  const button = document.getElementById("theme-toggle");

  function applyTheme(light) {
    document.body.classList.toggle("light-theme", light);
    button.textContent = light
      ? "黒背景に切替"
      : "白背景に切替";
    button.setAttribute("aria-pressed", String(light));
  }

  let light = false;

  try {
    light =
      localStorage.getItem("subtitle-collab-theme")
      === "light";
  } catch (_) {
    // 保存できない環境でも切替可能。
  }

  applyTheme(light);

  button.onclick = () => {
    const next =
      !document.body.classList.contains("light-theme");

    applyTheme(next);

    try {
      localStorage.setItem(
        "subtitle-collab-theme",
        next ? "light" : "dark"
      );
    } catch (_) {
      // 保存できない環境でも切替可能。
    }
  };
}

function bindRoleButtons() {
  document.getElementById("btnA").onclick = () => startApp("A");
  document.getElementById("btnB").onclick = () => startApp("B");
  document.getElementById("btnC").onclick = () => startApp("C");
}

function startApp(role) {
  myRole = role;

  document.getElementById("role-select").style.display = "none";
  document.getElementById("app").style.display = "block";

  createLayout();
  createInputs();
  setGuideLine();
  connectSocket();
}

function createLayout() {
  document.getElementById("app").innerHTML = `
    <div id="workspace">
      <section
        id="columns"
        aria-label="担当者入力欄"
      ></section>

      <section id="log-panel">
        <h3>ログ</h3>
        <div
          id="log"
          class="fixed"
          aria-label="送信ログ"
        ></div>
      </section>

      <section id="search-panel">
        <h3>検索（選択中テキストをF4）</h3>
        <iframe
          id="searchFrame"
          title="検索結果"
          scrolling="yes"
        ></iframe>
      </section>
    </div>
  `;
}

function getOrder() {
  if (myRole === "A") return ["C","A","B"];
  if (myRole === "B") return ["A","B","C"];
  if (myRole === "C") return ["B","C","A"];

  return ["A","B","C"];
}

function createInputs() {
  const columns = document.getElementById("columns");

  columns.innerHTML = getOrder().map(k => `
    <div class="input-row">
      <div
        id="label-${k}"
        class="role-label"
      ></div>
      <textarea
        id="input-${k}"
        class="fixed"
        aria-label="${k}担当入力欄"
      ></textarea>
    </div>
  `).join("");

  ["A","B","C"].forEach(k => {
    document.getElementById("input-" + k).oninput = e => {
      inputs[k] = e.target.value;

      if (socket && isConnected) {
        socket.emit("typing", {
          key:k,
          value:e.target.value
        });
      }
    };
  });

  updateUI();
}

function setGuideLine() {
  const span = document.createElement("span");

  span.style.font = "24px Consolas";
  span.style.position = "absolute";
  span.style.visibility = "hidden";
  span.style.whiteSpace = "pre";
  span.innerText = "あ".repeat(15.5);

  document.body.appendChild(span);
  const w = span.getBoundingClientRect().width;
  span.remove();

  document.querySelectorAll("#columns textarea").forEach(el => {
    el.style.backgroundImage = `
      linear-gradient(
        to right,
        transparent ${w}px,
        red ${w}px,
        red ${w + 1}px,
        transparent ${w + 1}px
      )
    `;
  });
}

function connectSocket() {
  socket = io("https://subtitle-server-czoz.onrender.com");

  socket.on("connect", () => {
    isConnected = true;

    socket.emit("register", {
      key:myRole
    });
  });

  socket.on("disconnect", () => {
    isConnected = false;

    if (myRole) {
      connectedRoles[myRole] = false;
    }

    updateUI();
  });

  socket.on("presence", presence => {
    connectedRoles = {
      A:!!presence.A,
      B:!!presence.B,
      C:!!presence.C
    };

    ["A","B","C"].forEach(k => {
      if (k !== myRole && !connectedRoles[k]) {
        inputs[k] = "";
      }
    });

    updateUI();
  });

  socket.on("typing", ({key,value}) => {
    inputs[key] = value;
    updateUI();
  });

  socket.on("log", data => {
    log.push(data);
    updateUI();
  });

  socket.on("active", next => {
    active = next;
    updateUI();
  });
}

function updateUI() {
  ["A","B","C"].forEach(k => {
    const label = document.getElementById("label-" + k);
    const input = document.getElementById("input-" + k);

    if (!label || !input) {
      return;
    }

    const online = connectedRoles[k];

    label.textContent = k;

    if (!online) {
      label.style.background = "var(--label-offline-bg)";
      label.style.color = "var(--offline-text)";
      label.title = "未接続";
    } else if (active === k) {
      label.style.background = "#0a0";
      label.style.color = "white";
      label.title = "送信担当";
    } else {
      label.style.background = "var(--label-bg)";
      label.style.color = "var(--label-text)";
      label.title = "接続中";
    }

    input.readOnly = (
      myRole !== k ||
      !online
    );

    if (!online) {
      input.style.backgroundColor = "var(--offline-bg)";
      input.style.color = "var(--offline-text)";
      input.style.borderColor = "var(--offline-border)";
      input.placeholder = "未接続";
    } else {
      input.style.backgroundColor = "";
      input.style.color = "";
      input.style.borderColor = "";
      input.placeholder = "";
    }

    if (k !== myRole) {
      input.value = inputs[k] || "";
    }
  });

  const logEl = document.getElementById("log");

  if (!logEl) {
    return;
  }

  const nextText = log
    .map(l =>
      String(l.text || "")
        .replace(/。(?=\r\n|\r|\n|$)/g, "｡")
    )
    .join("\n");

  const currentText = logEl.textContent;

  // typing通知ではログのDOMとスクロール位置を変更しない。
  if (nextText !== currentText) {
    const selection = window.getSelection();
    let selectingLog = false;

    if (selection && !selection.isCollapsed) {
      for (let i = 0; i < selection.rangeCount; i++) {
        if (selection.getRangeAt(i).intersectsNode(logEl)) {
          selectingLog = true;
          break;
        }
      }
    }

    const followBottom =
      !selectingLog &&
      logEl.scrollHeight -
        logEl.clientHeight -
        logEl.scrollTop <= 2;

    // 既存のテキストノードを残して新着ログだけを追加する。
    if (nextText.startsWith(currentText)) {
      logEl.appendChild(
        document.createTextNode(
          nextText.slice(currentText.length)
        )
      );
    } else {
      logEl.textContent = nextText;
    }

    if (followBottom) {
      logEl.scrollTop = logEl.scrollHeight;
    }
  }
}

function send() {
  if (!isConnected) {
    return;
  }

  if (!myRole) {
    return;
  }

  if (!connectedRoles[myRole]) {
    return;
  }

  if (active !== myRole) {
    return;
  }

  const text = inputs[myRole] || "";

  inputs[myRole] = "";
  document.getElementById("input-" + myRole).value = "";

  socket.emit("send", {
    key:myRole,
    text
  });

  socket.emit("typing", {
    key:myRole,
    value:""
  });

  updateUI();
}

function bindGlobalKeys() {
  document.addEventListener("keydown", handleKey);
}

function handleKey(e) {
  if (e.key === "F12") {
    e.preventDefault();

    if (
      myRole &&
      active === myRole
    ) {
      send();
    }
  }

  if (e.key === "F4") {
    e.preventDefault();

    const input = document.getElementById(
      "input-" + myRole
    );

    const frame = document.getElementById("searchFrame");

    if (!input || !frame) {
      return;
    }

    const text = input.value.substring(
      input.selectionStart,
      input.selectionEnd
    );

    if (!text) {
      return;
    }

    frame.src =
      "https://www.bing.com/search?q=" +
      encodeURIComponent(text);
  }
}
</script>

</body>
</html>
