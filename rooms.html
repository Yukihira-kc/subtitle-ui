<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ルーム選択 | 字幕コラボ v29</title>
<script src="connection.js?v=29"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#15191f;color:#edf1f7;font:16px Meiryo,sans-serif}main{max-width:980px;margin:0 auto;padding:32px 20px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:25px;margin:0}h2{font-size:20px;margin:0 0 15px}h3{font-size:17px;margin:0 0 10px}small,.muted{color:#a8b3c3}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;margin-top:22px}.panel{border:1px solid #556273;border-radius:8px;padding:22px;background:#1b222b}button,input,a.action{font:inherit;border-radius:4px}button,a.action{cursor:pointer;padding:9px 14px;border:1px solid #718198;background:#263447;color:white;text-decoration:none;display:inline-block}button:hover,a.action:hover{background:#354d68}button:disabled{opacity:.5;cursor:wait}.primary{background:#236f53;border-color:#38896b}input{width:100%;background:#12171e;color:#fff;border:1px solid #718198;padding:10px;margin-top:6px}label{display:block;margin:14px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.room{border-bottom:1px solid #455163;padding:15px 0}.room:last-child{border:0}.room-name{overflow-wrap:anywhere;flex:1;min-width:100px}.room small{display:block;margin-top:5px}#status{min-height:28px;margin:18px 0 0;color:#ffc179;white-space:pre-wrap}#status.ok{color:#77d9ab}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.danger{border-color:#b85858;color:#ffc8c8}.wide{grid-column:1/-1}#invite-url{font-size:13px}.help{font-size:13px;line-height:1.7}.title-wrap{overflow-wrap:anywhere}details{margin-top:24px;border-top:1px solid #455163;padding-top:16px}summary{cursor:pointer}[hidden]{display:none!important}@media(max-width:720px){.grid{grid-template-columns:1fr}main{padding:22px 14px}header{align-items:flex-start}h1{font-size:21px}.panel{padding:18px}}
</style></head><body><main>
<header><div><h1>字幕コラボ <small>v29</small></h1><p class="muted">使用するルームを選んでください。</p></div><button id="refresh" type="button">一覧を更新</button></header>
<p id="status" role="status" aria-live="polite">ルームを読み込み中…</p>
<div class="grid">
<section class="panel"><h2>ルーム一覧</h2><div id="room-list"></div></section>
<section class="panel"><h2>案件ルームを作成</h2><form id="create-form"><label>案件名<input id="new-name" required maxlength="80" autocomplete="off" placeholder="例：11月6日 こども家庭庁"></label><label>入室パスワード<input id="new-password" type="password" required minlength="4" maxlength="128" autocomplete="new-password"></label><p class="help muted">4〜128文字。案件の担当者に共有するパスワードを設定してください。</p><button class="primary" type="submit">ルームを作成</button></form><p class="help muted">ルームの作成に管理者登録は不要です。練習用はパスワードなしで使えます。</p></section>
<section class="panel wide" id="selected" hidden><h2 class="title-wrap" id="selected-name"></h2>
<form id="join-form" hidden><label>入室パスワード<input id="join-password" type="password" required minlength="4" maxlength="128" autocomplete="current-password"></label><button class="primary" type="submit">入室</button></form>
<div id="room-tools" hidden><p class="muted">使う画面を選んでください。</p><div class="actions"><a class="action primary" id="operator-link">入力画面（A・B・C）</a><a class="action" id="reviewer-link">校閲画面</a><a class="action" id="output-link" target="_blank" rel="noopener">字幕出力画面</a></div>
<label>担当者への共有URL<input id="invite-url" readonly aria-label="共有URL"></label><button type="button" id="copy-url">URLをコピー</button><p class="help muted">案件ルームのパスワードは、URLとは別に担当者へ共有してください。</p>
<details id="management"><summary>ルームの管理</summary><p class="help muted">このルームに認証済みの人が操作できます。パスワード変更時は各画面の再入室が必要です。</p><form id="password-form"><label>新しいパスワード<input id="change-password" type="password" required minlength="4" maxlength="128" autocomplete="new-password"></label><button type="submit">パスワードを変更</button></form><div class="actions"><button type="button" id="delete-room" class="danger">この案件ルームを削除</button><button type="button" id="forget-room">このブラウザの入室情報を解除</button></div></details>
</div></section>
</div></main><script src="rooms-ui.js?v=29"></script></body></html>
