<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>字幕コラボ</title>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<style>
body {
  background:#111;
  color:white;
  font-family:Meiryo, monospace;
}

.fixed {
  width:496px;
  font-family:Consolas, monospace;
  font-size:24px;
  line-height:34px;
  box-sizing:border-box;
}
</style>
</head>

<body>

<div id="role-select">
  <h2>担当を選択</h2>
  <button id="btnA">A</button>
  <button id="btnB">B</button>
  <button id="btnC">C</button>
</div>

<div id="app" style="display:none"></div>

<script>

let socket;
let isConnected = false;
let inputs = { A:"", B:"", C:"" };
let active = "A";
let log = [];
let myRole = null;

// ----------------
// 初期化
// ----------------
window.addEventListener("DOMContentLoaded", () => {

  btnA.onclick = () => selectRole("A");
  btnB.onclick = () => selectRole("B");
  btnC.onclick = () => selectRole("C");

});

function selectRole(role) {
  myRole = role;
  role-select.style.display = "none";
  app.style.display = "block";
  initUI();
  connectSocket();
}

// ----------------
// socket
// ----------------
function connectSocket() {

  socket = io("https://subtitle-server-czoz.onrender.com");

  socket.on("connect", () => isConnected = true);
  socket.on("disconnect", () => isConnected = false);

  socket.on("typing", ({ key, value }) => {
    inputs[key] = value;
    updateUI();
  });

  socket.on("log", (data) => {
    log.push(data);
    updateUI();
  });

  socket.on("active", (next) => {
    active = next;
    updateUI();
  });
}

// ----------------
// 並び
// ----------------
function getOrder() {
  if (myRole === "A") return ["C","A","B"];
  if (myRole === "B") return ["A","B","C"];
  if (myRole === "C") return ["B","C","A"];
  return ["A","B","C"];
}

// ----------------
// ✅ ログ処理（確定版）
// ----------------
function formatLogText(text) {
  const MAX = 31;
  let result = "";
  let line = "";
  let count = 0;

  for (let i = 0; i < text.length; i++) {
    let char = text[i];
    let w = char.match(/[ -~]/) ? 1 : 2;

    if (char === "。" && count === 30) w = 1;

    if (count + w > MAX) {
      result += line + "\n";
      line = "";
      count = 0;
    }

    line += char;
    count += w;

    if (count === MAX) {
      result += line + "\n";
      line = "";
      count = 0;
    }
  }

  result += line;
  return result;
}

// ----------------
// UI
// ----------------
function initUI() {

  app.innerHTML = `
    <div style="display:flex; gap:20px;">
      
      <div id="columns"></div>

      <!-- ログ -->
      <div>
        <h3>ログ</h3>
        <div id="log" class="fixed" style="
          height:400px;
          overflow-y:scroll;
          border:1px solid white;
          padding:4px;
          white-space:pre;
        "></div>
      </div>

      <!-- ✅ 検索復活 -->
      <div>
        <h3>検索</h3>
        <iframe id="searchFrame"
          style="width:600px;height:400px;border:1px solid white;">
        </iframe>
      </div>

    </div>
  `;

  const columns = document.getElementById("columns");

  columns.innerHTML =
    getOrder().map(k => `
      <div style="display:flex; gap:10px; margin-bottom:20px;">

        <div id="label-${k}" style="
          width:40px;height:180px;
          display:flex;align-items:center;justify-content:center;
          background:#555;color:white;">
        </div>

        <textarea id="input-${k}" class="fixed"
          style="height:180px;"></textarea>

      </div>
    `).join("");

  setGuideLine(); // ✅ 線を動的生成

  ["A","B","C"].forEach(k => {
    document.getElementById("input-" + k).oninput = e => {
      inputs[k] = e.target.value;
      if (socket && isConnected) {
        socket.emit("typing",{key:k,value:e.target.value});
      }
    };
  });

  updateUI();
}

// ✅ 縦線を正確に作る
