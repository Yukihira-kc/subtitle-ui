<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>字幕コあラボ</title>

<!-- ✅ これ絶対必要 -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

</head>

<body style="background:#111;color:white;font-family:sans-serif">

<h1>字幕コラボ</h1>

<div id="role-select">
  <h2>選択：</h2>
  <button id="btnA">A</button>
  <button id="btnB">B</button>
  <button id="btnC">C</button>
</div>

<div id="app" style="display:none"></div>

<script>
const socket = io("https://subtitle-server-czoz.onrender.com");

let myRole = null;
let inputs = { A:"", B:"", C:"" };

// ✅ ボタンをJSで設定（onclickをHTMLに書かない）
document.getElementById("btnA").onclick = () => selectRole("A");
document.getElementById("btnB").onclick = () => selectRole("B");
document.getElementById("btnC").onclick = () => selectRole("C");

function selectRole(role) {
  console.log("選択された:", role); // ← 確認用

  myRole = role;

  document.getElementById("role-select").style.display = "none";
  document.getElementById("app").style.display = "block";

  render();
}

function render() {
  const app = document.getElementById("app");

  app.innerHTML = `
    <div>
      ${["A","B","C"].map(k => `
        <div>
          <h3>${k} ${myRole === k ? "(自分)" : ""}</h3>

          <textarea
            id="input-${k}"
            ${myRole !== k ? "disabled" : ""}
            style="width:200px;height:100px"
          ></textarea>
        </div>
      `).join("")}
    </div>
  `;
}

// ✅ 最初にログ出す（生きてるか確認）
console.log("JS起動OK");
</script>

</body>
</html>
``
