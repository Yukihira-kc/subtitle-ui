<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>字幕コ１１１１１」「」ラボ</title>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

</head>

<body style="background:#111;color:white;font-family:sans-serif">

<h1>字幕コラボ</h1>

<div id="role-select">
  <h2>担当を選んでください</h2>
  <button onclick="selectRole('A')">A</button>
  <button onclick="selectRole('B')">B</button>
  <button onclick="selectRole('C')">C</button>
</div>

<div id="app" style="display:none"></div>

<script>
const socket = io("https://subtitle-server-czoz.onrender.com");

let inputs = { A: "", B: "", C: "" };
let active = "A";
let log = [];
let myRole = null;

function selectRole(role) {
  myRole = role;
  document.getElementById("role-select").style.display = "none";
  document.getElementById("app").style.display = "block";
  render();
}

function render() {
  const app = document.getElementById("app");

  app.innerHTML = `
    <div style="display:flex;gap:20px">
      <div>
        ${["A","B","C"].map(k => `
          <div>
            <h3>
              ${k}
              ${myRole === k ? "（自分）" : ""}
              ${active === k ? " ←送信可" : ""}
            </h3>

            <textarea
              id="input-${k}"
              style="width:200px;height:100px;font-size:20px"
              ${myRole !== k ? "disabled" : ""}
              oninput="typing('${k}', this.value)"
            ></textarea>

            <br>

            <button
              onclick="send('${k}')"
              ${active !== k || myRole !== k ? "disabled" : ""}
            >
              送信
            </button>
          </div>
        `).join("")}
      </div>

      <div>
        <h2>ログ</h2>
        ${log.map(l => `<div>[${l.key}] ${l.text}</div>`).join("")}
      </div>
    </div>
