<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>字幕コラボ</title>

<!-- ✅ ここ絶対このまま -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

</head>

<body style="background:#111;color:white;font-family:Meiryo, sans-serif">

<div id="role-select">
  <h2>担当を選択</h2>
  <button id="btnA">A</button>
  <button id="btnB">B</button>
  <button id="btnC">C</button>
</div>

<div id="app" style="display:none"></div>

<script>
let socket;
let inputs = { A:"", B:"", C:"" };
let active = "A";
let log = [];
let myRole = null;

// ✅ DOM読み込み後に設定
window.onload = () => {
  document.getElementById("btnA").onclick = () => selectRole("A");
  document.getElementById("btnB").onclick = () => selectRole("B");
  document.getElementById("btnC").onclick = () => selectRole("C");
};

function selectRole(role) {
  console.log("選択:", role); // ✅ 動作確認用

  myRole = role;

  document.getElementById("role-select").style.display = "none";
  document.getElementById("app").style.display = "block";

  initUI();
  connectSocket();
}

// ✅ socket
function connectSocket() {
  try {
    socket = io("https://subtitle-server-czoz.onrender.com");

    socket.on("typing", ({ key, value }) => {
      inputs[key] = value;
      updateUI();
    });

    socket.on("log", (data) => {
      log.push(data);
      updateUI();
    });

    socket.on("active", (next) => {
      active = next;
      updateUI();
    });

  } catch (e) {
    console.log("socket error", e);
  }
}

// ✅ 並び
function getOrder() {
  if (myRole === "A") return ["C","A","B"];
  if (myRole === "B") return ["A","B","C"];
  if (myRole === "C") return ["B","C","A"];
  return ["A","B","C"];
}

// ✅ UI
function initUI() {
  const app = document.getElementById("app");

  app.innerHTML = `
    <div style="display:flex; gap:20px;">
      
      <div id="columns"></div>

      <div style="width:31ch; font-family:Consolas, monospace;">
        <h3>ログ</h3>
        <div id="log" style="border:1px solid white;height:400px;overflow:auto;padding:8px;"></div>
      </div>

      <div>
        <h3>検索</h3>
        <iframe id="searchFrame" style="width:600px;height:400px;border:1px solid white;"></iframe>
      </div>

    </div>
  `;

  document.getElementById("columns").innerHTML =
    getOrder().map(k => `
      <div style="display:flex; gap:10px; margin-bottom:20px;">
        
        <div id="label-${k}" style="
          width:40px;
          height:180px;
          display:flex;
          align-items:center;
          justify-content:center;
          border-radius:6px;
          font-weight:bold;
          color:#fff;
        "></div>

        <textarea
          id="input-${k}"
          style="
            width:500px;
            height:180px;
            font-family:Consolas, monospace;
            font-size:24px;
            line-height:1.4;

            background-image:
              linear-gradient(
                to right,
                transparent 0,
                transparent calc(28.5ch),
                red calc(28.5ch),
                red calc(28.5ch + 1px),
                transparent calc(28.5ch + 1px)
              );
          "
        ></textarea>
      </div>
    `).join("");

  ["A","B","C"].forEach(k => {
    document.getElementById("input-" + k).oninput = (e) => {
      inputs[k] = e.target.value;
    };
  });

  updateUI();
}

// ✅ UI更新
function updateUI() {
  ["A","B","C"].forEach(k => {
    const label = document.getElementById("label-" + k);
    const input = document.getElementById("input-" + k);

    if (!label || !input) return;

    label.textContent = k;
    label.style.backgroundColor = active === k ? "#00aa00" : "#555";

    input.readOnly = myRole !== k;
  });

  const logEl = document.getElementById("log");
  if (logEl) {
    logEl.innerHTML = log.map(l => l.text).join("<br>");
    logEl.scrollTop = logEl.scrollHeight;
  }
}

// ✅ F4検索
document.addEventListener("keydown", (e) => {
  if (e.key === "F4") {
    e.preventDefault();

    const input = document.getElementById("input-" + myRole);
    const frame = document.getElementById("searchFrame");

    if (!input || !frame) return;

    const start = input.selectionStart;
    const end = input.selectionEnd;

    if (start === end) return;

    const text = input.value.substring(start, end);

    frame.src =
      "https://www.bing.com/search?cc=JP&setlang=ja&form=MSNVS&q=" +
      encodeURIComponent(text);
  }
});
</script>

</body>
</html>
