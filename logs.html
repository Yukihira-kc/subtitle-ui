<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>保存ログ | 字幕連係 v29.8</title><script src="connection.js?v=29.8"></script><script src="log-backup.js?v=29.8"></script><style>
*{box-sizing:border-box}body{margin:0;background:#15191f;color:#edf1f7;font:16px Meiryo,sans-serif}main{max-width:1000px;margin:auto;padding:24px}header,.tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-size:24px}a{color:#72b7ff}button,select{font:inherit;padding:8px;background:#263447;color:white;border:1px solid #718198;border-radius:4px}select{max-width:100%;flex:1;min-width:180px}button{cursor:pointer}button:disabled{opacity:.5}[hidden]{display:none!important}.danger{border-color:#bc6666;color:#ffd1d1}.delete-tools{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}dialog{width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;background:#202630;color:#edf1f7;border:1px solid #718198;border-radius:8px;padding:20px}dialog::backdrop{background:#0009}dialog h2{font-size:19px;margin-top:0}#delete-targets{max-height:180px;overflow:auto;padding-left:22px;overflow-wrap:anywhere}#delete-error{color:#ff9b9b}pre{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #556273;padding:18px;min-height:260px;font:18px/1.7 Meiryo,sans-serif}.help{font-size:13px;color:#a8b3c3;line-height:1.7}#status{color:#ffc179}
</style></head><body><main><header><h1>保存ログ <small>v29.8</small></h1><a href="rooms.html">ルーム選択へ</a></header><p class="help">校閲に使用したこのPCの保存ログです。他のPCでは見られません。ルームが消えても閲覧できます。「TXTを生成」でテキストファイルをダウンロードできます。</p><div class="tools"><select id="saved-logs" aria-label="保存ログを選択"></select><button id="refresh">一覧を更新</button><button id="export" disabled>TXTを生成</button></div><div class="delete-tools"><button id="delete-selected" class="danger" disabled>選択したログを削除</button><button id="delete-all" class="danger" disabled>この端末の保存ログをすべて削除</button></div><p class="help">削除されるのは、このブラウザ内に保存したログだけです。入室情報・字幕設定・ダウンロード済みのTXTファイルは残ります。</p><p id="status" role="status"></p><p id="details" class="help"></p><pre id="content" aria-label="保存済み字幕全文">保存ログを選択してください。</pre></main><dialog id="delete-dialog" aria-labelledby="delete-title"><h2 id="delete-title">保存ログを削除しますか？</h2><p id="delete-description"></p><ul id="delete-targets"></ul><p class="help">削除したログは元に戻せません。必要なログは先にTXTを生成してください。校閲中の場合、削除後に送出した字幕は引き続き保存されます。</p><p id="delete-error" role="alert"></p><div class="tools"><button type="button" id="delete-confirm" class="danger">削除する</button><button type="button" id="delete-cancel">キャンセル</button></div></dialog><script src="logs.js?v=29.8"></script></body></html>
