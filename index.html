<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>字幕１１１コラボ</title>

<!-- ✅ ここ絶対に壊さない -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

</head>

<body style="background:#111;color:white;font-family:Meiryo, sans-serif">

<div id="role-select">
  <h2>担当を選択</h2>
  <button id="btnA">A</button>
  <button id="btnB">B</button>
  <button id="btnC">C</button>
</div>

<div id="app" style="display:none"></div>

<script>
// ----------------
// 状態
// ----------------
let socket;
let inputs = { A:"", B:"", C:"" };
let active = "A";
let log = [];
let myRole = null;

// ----------------
// 初期ボタン
// ----------------
window.onload = () => {
  document.getElementById("btnA").onclick = () => selectRole("A");
  document.getElementById("btnB").onclick = () => selectRole("B");
  document.getElementById("btnC").onclick = () => selectRole("C");
};

// ----------------
// 役割選択
// ----------------
function selectRole(role) {
  myRole = role;

  document.getElementById("role-select").style.display = "none";
  document.getElementById("app").style.display = "block";

  initUI();
  connectSocket();
}

// ----------------
// socket接続
// ----------------
function connectSocket() {
  try {
    socket = io("https://subtitle-server-czoz.onrender.com");

    socket.on("typing", ({ key, value }) => {
      inputs[key] = value;
      updateUI();
    });

    socket.on("log", (data) => {
      log.push(data); // ✅ 下に追加
      updateUI();
    });

    socket.on("active", (next) => {
      active = next;
      updateUI();
    });

  } catch(e) {
    console.log("socket error", e);
  }
}

// ----------------
// 並び
// ----------------
function getOrder() {
  if (myRole === "A") return ["C","A","B"];
  if (myRole === "B") return ["A","B","C"];
  if (myRole === "C") return ["B","C","A"];
  return ["A","B","C"];
}

// ----------------
// UI生成
// ----------------
function initUI() {
  const app = document.getElementById("app");

  app.innerHTML = `
    <div style="display:flex; gap:20px;">
      
      <div id="columns"></div>

      <!-- ✅ ログ（32ch） -->
      <div style="width:32ch; font-family:Consolas, monospace;">
        <h3>ログ</h3>
        <div id="log" style="
          border:1px solid white;
          height:400px;
          overflow:auto;
          padding:8px;
          white-space:pre-wrap;
        "></div>
      </div>

      <!-- ✅ 検索 -->
      <div>
        <h3>検索</h3>
        <iframe id="searchFrame"
          style="width:600px;height:400px;border:1px solid white;">
        </iframe>
      </div>

    </div>
  `;

  // 入力欄生成
  document.getElementById("columns").innerHTML =
    getOrder().map(k => `
      <div style="display:flex; gap:10px; margin-bottom:20px;">
        
        <div id="label-${k}" style="
          width:40px;
          height:180px;
          display:flex;
          align-items:center;
          justify-content:center;
          border-radius:6px;
          font-weight:bold;
          color:#fff;
        "></div>

        <textarea
          id="input-${k}"
          style="
            width:500px;
            height:180px;
            font-family:Consolas, monospace;
            font-size:24px;
            line-height:1.4;

            background-image:
              linear-gradient(
                to right,
                transparent 0,
                transparent calc(28.5ch),
                red calc(28.5ch),
                red calc(28.5ch + 1px),
                transparent calc(28.5ch + 1px)
              );
          "
        ></textarea>
      </div>
    `).join("");

  ["A","B","C"].forEach(k => {
    document.getElementById("input-" + k).oninput = (e) => {
      inputs[k] = e.target.value;
      if (socket) socket.emit("typing", { key: k, value: e.target.value });
    };
  });

  updateUI();
}

// ----------------
// 更新
// ----------------
function updateUI() {

  ["A","B","C"].forEach(k => {

    const label = document.getElementById("label-" + k);
    const input = document.getElementById("input-" + k);

    if (!label || !input) return;

    label.textContent = k;
    label.style.backgroundColor =
      active === k ? "#00aa00" : "#555";

    input.readOnly = myRole !== k;

    // ✅ 自分以外は強制反映
    if (k !== myRole) {
      input.value = inputs[k] || "";
    }
  });

  // ✅ ログ表示
  const logEl = document.getElementById("log");
  if (logEl) {
    logEl.innerHTML = log.map(l => l.text).join("\n");

    // ✅ 強制スクロール
    logEl.scrollTop = logEl.scrollHeight;
  }
}

// ----------------
// 送信
// ----------------
function send(key) {
  const text = inputs[key] || "";

  inputs[key] = "";
  const el = document.getElementById("input-" + key);
  if (el) el.value = "";

  if (socket) {
    socket.emit("send", { key, text });
    socket.emit("typing", { key, value: "" });
  }

  updateUI();
}

// ----------------
// ✅ F12（元仕様維持）
// ----------------
document.addEventListener("keydown", (e) => {
  if (e.key === "F12") {
    e.preventDefault();
    if (myRole && active === myRole) {
      send(myRole);
    }
  }
});

// ----------------
// ✅ F4検索
// ----------------
document.addEventListener("keydown", (e) => {

  if (e.key === "F4") {
    e.preventDefault();

    if (!myRole) return;

    const input = document.getElementById("input-" + myRole);
    const frame = document.getElementById("searchFrame");

    if (!input || !frame) return;

    const start = input.selectionStart;
    const end = input.selectionEnd;

    if (start === end) return;

    const text = input.value.substring(start, end);

    frame.src =
      "https://www.bing.com/search?cc=JP&setlang=ja&form=MSNVS&q=" +
      encodeURIComponent(text);
  }
});

</script>

</body>
</html>
