<!doctype html><html lang="ja"><meta charset="utf-8"><title>字幕表示 v24</title><script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script><script src="connection.js"></script><script src="shared.js"></script><script src="pagination.js"></script><script src="caption.js"></script><style>body{margin:0;background:#00ff00}</style><div id="text"></div><script>
const socket=SubtitleConnection.connect(),text=document.getElementById('text');let settings={columns:20,fontSize:32,lineCount:2,keyColor:'#00ff00'},current={id:0,lines:[]};
socket.on('connect',()=>socket.emit('joinOutput'));socket.on('settings',s=>{settings=s;document.body.style.background=s.keyColor;CaptionView.render(text,current,settings);});socket.on('caption',s=>{current=s;CaptionView.render(text,s,settings);CaptionView.confirm(socket,s);});document.addEventListener('visibilitychange',()=>CaptionView.confirm(socket,current));
window.addEventListener('resize',()=>CaptionView.render(text,current,settings));</script></html>
