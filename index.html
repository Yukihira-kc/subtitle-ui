<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>字幕コラボ</title>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<style>
body {
  background:#111;
  color:white;
  font-family:Meiryo, monospace;
}

.fixed {
  width:496px;
  font-family:Consolas, monospace;
  font-size:24px;
  line-height:34px;
  box-sizing:border-box;
}

.role-button {
  min-width:80px;
  padding:8px 16px;
  margin-right:8px;
}

.role-button:disabled {
  opacity:0.35;
  cursor:not-allowed;
}
</style>
</head>

<body>

<div id="role-select">
  <h2>担当を選択</h2>

  <button id="btnA" class="role-button">A</button>
  <button id="btnB" class="role-button">B</button>
  <button id="btnC" class="role-button">C</button>
</div>

<div id="app" style="display:none"></div>

<script>

// =====================
let socket;
let isConnected = false;
let myRole = null;
let pendingRole = null;

let inputs = {
  A:"",
  B:"",
  C:""
};

let active = null;

let connectedRoles = {
  A:false,
  B:false,
  C:false
};

let log = [];

// =====================
window.addEventListener("DOMContentLoaded", init);

function init() {

  bindRoleButtons();
  bindGlobalKeys();
  connectSocket();
  updateRoleButtons();
}

// =====================
function bindRoleButtons() {

  document.getElementById("btnA").onclick = () => startApp("A");
  document.getElementById("btnB").onclick = () => startApp("B");
  document.getElementById("btnC").onclick = () => startApp("C");
}

// =====================
// 担当選択ボタン更新
function updateRoleButtons() {

  ["A","B","C"].forEach(k => {

    const button = document.getElementById("btn" + k);

    if (!button) {
      return;
    }

    const occupied = connectedRoles[k];

    button.disabled =
      !isConnected ||
      occupied ||
      pendingRole !== null;

    if (occupied) {

      button.textContent = k + "（使用中）";

    } else {

      button.textContent = k;
    }
  });
}

// =====================
// 担当選択
function startApp(role) {

  if (!socket || !isConnected) {
    return;
  }

  if (connectedRoles[role]) {
    return;
  }

  if (pendingRole !== null) {
    return;
  }

  pendingRole = role;

  updateRoleButtons();

  socket.emit("register", {
    key:role
  });
}

// =====================
// 担当登録成功後に画面を開く
function openApp(role) {

  myRole = role;
  pendingRole = null;

  document.getElementById("role-select").style.display = "none";
  document.getElementById("app").style.display = "block";

  createLayout();
  createInputs();
  setGuideLine();

  updateUI();
}

// =====================
function createLayout() {

  document.getElementById("app").innerHTML = `
    <div style="display:flex; gap:20px;">

      <div id="columns"></div>

      <div>
        <h3>ログ</h3>

        <div id="log" class="fixed" style="
          height:400px;
          overflow-y:scroll;
          border:1px solid white;
          padding:4px;
          white-space:pre-wrap;
          overflow-wrap:anywhere;
        "></div>
      </div>

      <div>
        <h3>検索</h3>

        <iframe
          id="searchFrame"
          style="
            width:600px;
            height:400px;
            border:1px solid white;
          ">
        </iframe>
      </div>

    </div>
  `;
}

// =====================
function getOrder() {

  if (myRole === "A") return ["C","A","B"];
  if (myRole === "B") return ["A","B","C"];
  if (myRole === "C") return ["B","C","A"];

  return ["A","B","C"];
}

// =====================
function createInputs() {

  const columns = document.getElementById("columns");

  columns.innerHTML = getOrder().map(k => `
    <div style="
      display:flex;
      gap:10px;
      margin-bottom:20px;
    ">

      <div
        id="label-${k}"
        style="
          width:40px;
          height:180px;
          display:flex;
          align-items:center;
          justify-content:center;
          background:#555;
          color:white;
        ">
      </div>

      <textarea id="input-${k}" class="fixed" style="height:180px;"></textarea>

    </div>
  `).join("");

  ["A","B","C"].forEach(k => {

    document.getElementById("input-" + k).oninput = e => {

      inputs[k] = e.target.value;

      if (socket && isConnected) {

        socket.emit("typing", {
          key:k,
          value:e.target.value
        });
      }
    };
  });

  updateUI();
}

// =====================
function setGuideLine() {

  const span = document.createElement("span");

  span.style.font = "24px Consolas";
  span.innerText = "あ".repeat(15.5);

  document.body.appendChild(span);

  const w = span.getBoundingClientRect().width;

  document.body.removeChild(span);

  document.querySelectorAll("textarea").forEach(el => {

    el.style.backgroundImage = `
      linear-gradient(
        to right,
        transparent ${w}px,
        red ${w}px,
        red ${w + 1}px,
        transparent ${w + 1}px
      )
    `;
  });
}

// =====================
function connectSocket() {

  socket = io("https://subtitle-server-czoz.onrender.com");

  // =====================
  socket.on("connect", () => {

    isConnected = true;

    updateRoleButtons();

    // アプリ使用中にSocket再接続した場合
    if (myRole) {

      socket.emit("register", {
        key:myRole
      });
    }
  });

  // =====================
  socket.on("disconnect", () => {

    isConnected = false;
    pendingRole = null;

    if (myRole) {
      connectedRoles[myRole] = false;
    }

    updateRoleButtons();
    updateUI();
  });

  // =====================
  socket.on("register-success", ({key}) => {

    pendingRole = null;

    // 初回担当選択時のみ画面を作成
    if (!myRole) {
      openApp(key);
    }

    connectedRoles[key] = true;

    updateRoleButtons();
    updateUI();
  });

  // =====================
  socket.on("register-error", ({key,reason}) => {

    pendingRole = null;

    if (!myRole && reason === "occupied") {

      connectedRoles[key] = true;

      alert(
        key +
        "はすでに使用中です。別の担当を選択してください。"
      );
    }

    updateRoleButtons();
    updateUI();
  });

  // =====================
  socket.on("presence", presence => {

    connectedRoles = {
      A:!!presence.A,
      B:!!presence.B,
      C:!!presence.C
    };

    // 未接続になった他担当の古い入力内容を消す
    ["A","B","C"].forEach(k => {

      if (k !== myRole && !connectedRoles[k]) {
        inputs[k] = "";
      }
    });

    updateRoleButtons();
    updateUI();
  });

  // =====================
  socket.on("typing", ({key,value}) => {

    inputs[key] = value;

    updateUI();
  });

  // =====================
  socket.on("log", data => {

    log.push(data);

    updateUI();
  });

  // =====================
  socket.on("active", next => {

    active = next;

    updateUI();
  });
}

// =====================
function updateUI() {

  ["A","B","C"].forEach(k => {

    const label = document.getElementById("label-" + k);
    const input = document.getElementById("input-" + k);

    if (!label || !input) {
      return;
    }

    const online = connectedRoles[k];

    // =====================
    // 担当ラベル

    label.textContent = k;

    if (!online) {

      label.style.background = "#333";
      label.style.color = "#777";
      label.title = "未接続";

    } else if (active === k) {

      label.style.background = "#0a0";
      label.style.color = "white";
      label.title = "送信担当";

    } else {

      label.style.background = "#555";
      label.style.color = "white";
      label.title = "接続中";
    }

    // =====================
    // 入力欄

    input.readOnly = (
      myRole !== k ||
      !online
    );

    if (!online) {

      input.style.backgroundColor = "#2a2a2a";
      input.style.color = "#777";
      input.style.borderColor = "#444";

      input.placeholder = "未接続";

    } else {

      input.style.backgroundColor = "";
      input.style.color = "";
      input.style.borderColor = "";

      input.placeholder = "";
    }

    // 自分以外の入力欄だけ同期
    if (k !== myRole) {
      input.value = inputs[k] || "";
    }
  });

  // =====================
  // ログ

  const logEl = document.getElementById("log");

  if (logEl) {

    logEl.textContent =
      log
        .map(l =>
          String(l.text || "")
            .replace(/。/g,"｡")
        )
        .join("\n");

    logEl.scrollTop = logEl.scrollHeight;
  }
}

// =====================
function send() {

  if (!isConnected) {
    return;
  }

  if (!myRole) {
    return;
  }

  if (!connectedRoles[myRole]) {
    return;
  }

  if (active !== myRole) {
    return;
  }

  const text = inputs[myRole] || "";

  inputs[myRole] = "";

  document.getElementById(
    "input-" + myRole
  ).value = "";

  socket.emit("send", {
    key:myRole,
    text
  });

  socket.emit("typing", {
    key:myRole,
    value:""
  });

  updateUI();
}

// =====================
function bindGlobalKeys() {

  document.addEventListener(
    "keydown",
    handleKey
  );
}

// =====================
function handleKey(e) {

  // =====================
  // F12送信

  if (e.key === "F12") {

    e.preventDefault();

    if (
      myRole &&
      active === myRole
    ) {
      send();
    }
  }

  // =====================
  // F4検索

  if (e.key === "F4") {

    e.preventDefault();

    const input =
      document.getElementById(
        "input-" + myRole
      );

    const frame =
      document.getElementById(
        "searchFrame"
      );

    if (!input || !frame) {
      return;
    }

    const text =
      input.value.substring(
        input.selectionStart,
        input.selectionEnd
      );

    if (!text) {
      return;
    }

    frame.src =
      "https://www.bing.com/search?q=" +
      encodeURIComponent(text);
  }
}

</script>

</body>
</html>
