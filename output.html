<!doctype html><html lang="ja"><meta charset="utf-8"><title>字幕表示 v29.8</title><script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script><script src="connection.js?v=29.8"></script><script src="shared.js?v=29.8"></script><script src="pagination.js?v=29.8"></script><script src="caption.js?v=29.8"></script><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap');body{margin:0;background:#00ff00}</style><div id="text"></div><script>
const socket=SubtitleConnection.connect(),text=document.getElementById('text');let settings={columns:15,fontSize:32,lineCount:2,keyColor:'#00ff00',captionFont:'noto-sans-jp',textColor:'#ffffff',outline:true,fontWeight:'normal'},current={id:0,lines:[]};
let confirmation=0;
function confirmOutput(){
  const ticket=++confirmation,id=current.id;
  if(!id||!socket.connected)return;
  if(document.visibilityState!=='visible'){
    socket.emit('captionPresented',{id,visible:false});
    return;
  }
  let sent=false;
  const send=()=>{
    if(sent||ticket!==confirmation||!socket.connected||document.visibilityState!=='visible')return;
    sent=true;
    socket.emit('captionPresented',{id,visible:true});
  };
  requestAnimationFrame(()=>requestAnimationFrame(send));
  // A visible output window can be unfocused while the operator works elsewhere.
  if(!document.hasFocus())setTimeout(send,250);
}
socket.on('connect',()=>socket.emit('joinOutput'));
socket.on('disconnect',()=>{++confirmation;});
socket.on('settings',s=>{settings=s;document.body.style.background=s.keyColor;CaptionView.render(text,current,settings);});
socket.on('caption',s=>{current=s;CaptionView.render(text,s,settings);confirmOutput();});
document.addEventListener('visibilitychange',confirmOutput);
window.addEventListener('blur',confirmOutput);
window.addEventListener('resize',()=>CaptionView.render(text,current,settings));</script></html>
