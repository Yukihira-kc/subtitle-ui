<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>字幕コラボ</title>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

</head>

<body style="background:#111;color:white;font-family:sans-serif">

<h1>字幕コラボ</h1>

<div id="role-select">
  <h2>担当を選択</h2>
  <button id="btnA">A</button>
  <button id="btnB">B</button>
  <button id="btnC">C</button>
</div>

<div id="app" style="display:none"></div>

<script>

// ✅ ソケットは後から接続（ここ重要）
let socket = null;

function connectSocket() {
  try {
    socket = io("https://subtitle-server-czoz.onrender.com", {
      reconnection: true,
      timeout: 5000
    });

    socket.on("connect", () => {
      console.log("サーバー接続成功");
    });

    socket.on("connect_error", () => {
      console.log("接続エラー（起動待ち）");
    });

  } catch (e) {
    console.log("socket初期化失敗", e);
  }
}

connectSocket();

let inputs = { A:"", B:"", C:"" };
let active = "A";
let log = [];
let myRole = null;

// ✅ 並び順
function getOrder() {
  if (myRole === "A") return ["C", "A", "B"];
  if (myRole === "B") return ["A", "B", "C"];
  if (myRole === "C") return ["B", "C", "A"];
  return ["A", "B", "C"];
}

// ✅ ボタンイベント（エラー防止でJS側に書く）
window.onload = () => {
  document.getElementById("btnA").onclick = () => selectRole("A");
  document.getElementById("btnB").onclick = () => selectRole("B");
  document.getElementById("btnC").onclick = () => selectRole("C");
};

// ✅ 役割選択（ここが止まってた）
function selectRole(role) {
  console.log("選択:", role);

  myRole = role;

  document.getElementById("role-select").style.display = "none";
  document.getElementById("app").style.display = "block";

  render();
}

// ✅ 描画

    <div style="display:flex;gap:20px">
      <div>

          <div>
            <h3>
              ${k}
              ${myRole === k ? "(自分)" : ""}
              ${active === k ? " ←送信可" : ""}
            </h3>

            <textarea
