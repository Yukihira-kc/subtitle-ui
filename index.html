<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>字幕コラボ</title>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<style>
body {
  background:#111;
  color:white;
  font-family:Meiryo, monospace;
}

.fixed {
  width:496px;
  font-family:Consolas, monospace;
  font-size:24px;
  line-height:34px;
  box-sizing:border-box;
}
</style>
</head>

<body>

<div id="role-select">
  <h2>担当を選択</h2>
  <button id="btnA">A</button>
  <button id="btnB">B</button>
  <button id="btnC">C</button>
</div>

<div id="app" style="display:none"></div>

<script>

// =====================
let socket;
let isConnected = false;
let myRole = null;
let inputs = { A:"", B:"", C:"" };
let active = "A";
let log = [];

// =====================
window.addEventListener("DOMContentLoaded", init);

function init() {
  bindRoleButtons();
  bindGlobalKeys();
}

// =====================
function bindRoleButtons() {
  document.getElementById("btnA").onclick = () => startApp("A");
  document.getElementById("btnB").onclick = () => startApp("B");
  document.getElementById("btnC").onclick = () => startApp("C");
}

function startApp(role) {
  myRole = role;

  document.getElementById("role-select").style.display = "none";
  document.getElementById("app").style.display = "block";

  createLayout();
  createInputs();
  setGuideLine();
  connectSocket();
}

// =====================
function createLayout() {
  document.getElementById("app").innerHTML = `
    <div style="display:flex; gap:20px;">
      <div id="columns"></div>

      <div>
        <h3>ログ</h3>
        <div id="log" style="
          height:400px;
          overflow-y:scroll;
          border:1px solid white;
          padding:4px;
          white-space:pre-wrap;
          overflow-wrap:anywhere;
        "></div>
      </div>

      <div>
        <h3>検索</h3>
        <iframe id="searchFrame"
          style="width:600px;height:400px;border:1px solid white;">
        </iframe>
      </div>
    </div>
  `;
}

// =====================
function getOrder(){
  if(myRole==="A") return ["C","A","B"];
  if(myRole==="B") return ["A","B","C"];
  if(myRole==="C") return ["B","C","A"];
}

function createInputs(){
  const columns = document.getElementById("columns");

  columns.innerHTML = getOrder().map(k=>`
    <div style="display:flex; gap:10px; margin-bottom:20px;">
      <div id="label-${k}" style="
        width:40px;height:180px;
        display:flex;align-items:center;justify-content:center;
        background:#555;color:white;"></div>

      <textarea id="input-${k}" class="fixed"
        style="height:180px;"></textarea>
    </div>
  `).join("");

  ["A","B","C"].forEach(k=>{
    document.getElementById("input-"+k).oninput = e=>{
      inputs[k]=e.target.value;

      if(socket && isConnected){
        socket.emit("typing",{key:k,value:e.target.value});
      }
    };
  });

  updateUI();
}

// =====================
function setGuideLine(){

  const span=document.createElement("span");
  span.style.font="24px Consolas";
  span.innerText="あ".repeat(15.5);

  document.body.appendChild(span);

  const w=span.getBoundingClientRect().width;

  document.body.removeChild(span);

  document.querySelectorAll("textarea").forEach(el=>{
    el.style.backgroundImage=`
      linear-gradient(
        to right,
        transparent ${w}px,
        red ${w}px,
        red ${w+1}px,
        transparent ${w+1}px
      )`;
  });

  const logEl=document.getElementById("log");

  if(logEl){
    logEl.style.width=(w + 8) + "px";
    logEl.style.maxWidth=(w + 8) + "px";
    logEl.style.fontFamily="Consolas, monospace";
    logEl.style.fontSize="24px";
    logEl.style.lineHeight="34px";
    logEl.style.boxSizing="border-box";
  }
}

// =====================
function connectSocket(){
  socket=io("https://subtitle-server-czoz.onrender.com");

  socket.on("connect",()=>isConnected=true);
  socket.on("disconnect",()=>isConnected=false);

  socket.on("typing",({key,value})=>{
    inputs[key]=value;
    updateUI();
  });

  socket.on("log",data=>{
    log.push(data);
    updateUI();
  });

  socket.on("active",next=>{
    active=next;
    updateUI();
  });
}

// =====================
function updateUI(){

  ["A","B","C"].forEach(k=>{
    const label=document.getElementById("label-"+k);
    const input=document.getElementById("input-"+k);

    if(!label||!input)return;

    label.textContent=k;
    label.style.background=active===k?"#0a0":"#555";
    input.readOnly=myRole!==k;

    if(k!==myRole) input.value=inputs[k]||"";
  });

  const logEl=document.getElementById("log");

  logEl.textContent =
    log
      .map(l =>
        String(l.text || "")
          .replace(/。/g,"｡")
      )
      .join("\n");

  logEl.scrollTop=logEl.scrollHeight;
}

// =====================
function send(){

  if(!isConnected)return;

  const text=inputs[myRole]||"";

  inputs[myRole]="";
  document.getElementById("input-"+myRole).value="";

  socket.emit("send",{key:myRole,text});
  socket.emit("typing",{key:myRole,value:""});

  updateUI();
}

// =====================
function Listener("keydown",handleKey);
}

function handleKey(e){

  if(e.key==="F12"){
    e.preventDefault();
    if(myRole && active===myRole) send();
  }

  if(e.key==="F4"){
    e.preventDefault();

    const input=document.getElementById("input-"+myRole);
    const frame=document.getElementById("searchFrame");

    if(!input||!frame)return;

    const text=input.value.substring(
      input.selectionStart,
      input.selectionEnd
    );

    if(!text)return;

    frame.src="https://www.bing.com/search?q="+
      encodeURIComponent(text);
  }
}

</script>
</body>
</html>
