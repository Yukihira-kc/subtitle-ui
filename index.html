<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>字幕コラボ</title>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

</head>

<body style="background:#111;color:white;font-family:Meiryo, sans-serif">

<div id="role-select">
  <h2>担当を選択</h2>
  <button id="btnA">A</button>
  <button id="btnB">B</button>
  <button id="btnC">C</button>
</div>

<div id="app" style="display:none"></div>

<script>
let socket;
let inputs = { A:"", B:"", C:"" };
let active = "A";
let log = [];
let myRole = null;

// ✅ ボタン
document.getElementById("btnA").onclick = () => selectRole("A");
document.getElementById("btnB").onclick = () => selectRole("B");
document.getElementById("btnC").onclick = () => selectRole("C");

function selectRole(role) {
  myRole = role;
  document.getElementById("role-select").style.display = "none";
  document.getElementById("app").style.display = "block";
  initUI();
  connectSocket();
}

// ✅ socket
function connectSocket() {
  socket = io("https://subtitle-server-czoz.onrender.com");

  socket.on("typing", ({ key, value }) => {
    inputs[key] = value;
    updateUI();
  });

  socket.on("log", (data) => {
    log.unshift(data);
    updateUI();
  });

  socket.on("active", (next) => {
    active = next;
    updateUI();
  });
}

// ✅ 並び
function getOrder() {
  if (myRole === "A") return ["C","A","B"];
  if (myRole === "B") return ["A","B","C"];
  if (myRole === "C") return ["B","C","A"];
  return ["A","B","C"];
}

// ✅ UI生成
function initUI() {
  const app = document.getElementById("app");

  app.innerHTML = `
    <div style="display:flex; gap:20px;">
      
      <!-- 入力 -->
      <div id="columns"></div>

      <!-- ログ -->
      <div>
        <h3>ログ</h3>
        <div id="log"></div>
      </div>

      <!-- ✅ 検索ウィンドウ -->
      <div>
        <h3>検索</h3>
        <iframe id="searchFrame"
          style="
            width:600px;
            height:400px;
            border:1px solid white;
          "
        ></iframe>
      </div>

    </div>
  `;

  document.getElementById("columns").innerHTML =
    getOrder().map(k => `
      <div style="display:flex; gap:10px; margin-bottom:20px;">
        
        <!-- ✅ ラベル -->
        <div id="label-${k}" style="
          width:40px;
          height:180px;

          display:flex;
          align-items:center;
          justify-content:center;

          border-radius:6px;
          font-weight:bold;
          color:#fff;
        "></div>

        <!-- ✅ テキストボックス -->
        <textarea
          id="input-${k}"
          style="
            width:500px;
            height:180px;

            font-family: Consolas, monospace;
            font-size:24px;
            line-height:1.4;

            /* ✅ 縦線（28.5ch） */
            background-image:
              linear-gradient(
                to right,
                transparent 0,
                transparent calc(28.5ch),
                red calc(28.5ch),
                red calc(28.5ch + 1px),
                transparent calc(28.5ch + 1px)
              );
          "
        ></textarea>

      </div>
    `).join("");

  ["A","B","C"].forEach(k => {
    document.getElementById("input-" + k).oninput = (e) => {
      typing(k, e.target.value);
    };
  });

  updateUI();
}

// ✅ UI更新
function updateUI() {
  ["A","B","C"].forEach(k => {

    const label = document.getElementById("label-" + k);
    const input = document.getElementById("input-" + k);

    label.textContent = k;

    // ✅ ラベル背景色
    if (active === k) {
      label.style.backgroundColor = "#00aa00";
    } else {
      label.style.backgroundColor = "#555";
    }

    input.readOnly = myRole !== k;

    if (k !== myRole) {
      input.value = inputs[k] || "";
    } else {
      if (document.activeElement !== input) {
        input.value = inputs[k] || "";
      }
    }
  });

  document.getElementById("log").innerHTML =
    log.map(l => `<div>${l.text}</div>`).join("");
}

// ✅ 入力
function typing(key, value) {
  inputs[key] = value;
  if (socket) socket.emit("typing", { key, value });
}

// ✅ F12送信
document.addEventListener("keydown", (e) => {
  if (e.key === "F12") {
    e.preventDefault();
    if (myRole && active === myRole) {
      send(myRole);
    }
  }
});

// ✅ 送信
function send(key) {
  const inputEl = document.getElementById("input-" + key);
  if (inputEl) inputEl.value = "";

  const text = inputs[key];
  inputs[key] = "";

  if (socket) {
    socket.emit("send", { key, text });
    socket.emit("typing", { key, value: "" });
  }

  updateUI();
}

// ✅ F4検索（Bing）
document.addEventListener("keydown", (e) => {

  if (e.key === "F4") {
    e.preventDefault();

    if (!myRole) return;

    const input = document.getElementById("input-" + myRole);

    const start = input.selectionStart;
    const end = input.selectionEnd;

    if (start === end) return;

    const selectedText = input.value.substring(start, end);

    const url =
      "https://www.bing.com/search?q=" +
      encodeURIComponent(selectedText);

    document.getElementById("searchFrame").src = url;
  }
});

</script>
</body>
</html>
