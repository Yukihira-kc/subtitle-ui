<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>字幕コラボ</title>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>

<body style="background:#111;color:white;font-family:Meiryo, sans-serif">

<div id="role-select">
  <h2>担当を選択</h2>
  <button id="btnA">A</button>
  <button id="btnB">B</button>
  <button id="btnC">C</button>
</div>

<div id="app" style="display:none"></div>

<script>
let socket;
let inputs = { A:"", B:"", C:"" };
let active = "A";
let log = [];
let myRole = null;

window.onload = () => {
  btnA.onclick = () => selectRole("A");
  btnB.onclick = () => selectRole("B");
  btnC.onclick = () => selectRole("C");
};

function selectRole(role) {
  myRole = role;
  role-select.style.display = "none";
  app.style.display = "block";
  initUI();
  connectSocket();
}

function connectSocket() {
  socket = io("https://subtitle-server-czoz.onrender.com");

  socket.on("typing", ({ key, value }) => {
    inputs[key] = value;
    updateUI();
  });

  socket.on("log", (data) => {
    log.push(data);
    updateUI();
  });

  socket.on("active", (next) => {
    active = next;
    updateUI();
  });
}

function getOrder() {
  if (myRole === "A") return ["C","A","B"];
  if (myRole === "B") return ["A","B","C"];
  if (myRole === "C") return ["B","C","A"];
  return ["A","B","C"];
}

// ✅ 核心ロジック（仕様完全再現）
function formatLogText(text) {
  const max = 31; // 半角31
  let result = "";
  let count = 0;
  let line = "";

  function charWidth(c, nextChar, currentCount) {
    // ✅ 禁則：15文字目 + 「。」なら半角扱い
    if (c === "。" && currentCount === 30) {
      return 1; // 半角扱い（0.5文字）
    }
    return c.match(/[ -~]/) ? 1 : 2;
  }

  for (let i = 0; i < text.length; i++) {

    let char = text[i];
    let next = text[i+1];

    let w = charWidth(char, next, count);

    if (count + w > max) {
      result += line + "\n";
      line = char;
      count = w;
    } else {
      line += char;
      count += w;
    }

    // ✅ 行ちょうどなら強制改行
    if (count === max) {
      result += line + "\n";
      line = "";
      count = 0;
    }
  }

  result += line;
  return result;
}

function initUI() {
  app.innerHTML = `
    <div style="display:flex; gap:20px;">
      
      <div id="columns"></div>

      <div style="width:32ch; font-family:Consolas, monospace;">
        <h3>ログ</h3>
        <div id="log" style="
          border:1px solid white;
          height:400px;
          overflow-y: scroll;
          padding:8px;
          white-space:pre-wrap;
        "></div>
      </div>

      <div>
        <h3>検索</h3>
        <iframe id="searchFrame"
          style="width:600px;height:400px;border:1px solid white;"></iframe>
      </div>
    </div>
  `;

  columns.innerHTML =
    getOrder().map(k => `
      <div style="display:flex; gap:10px; margin-bottom:20px;">
        
        <div id="label-${k}" style="
          width:40px;
          height:180px;
          display:flex;
          align-items:center;
          justify-content:center;
          border-radius:6px;
          font-weight:bold;
          color:#fff;
        "></div>

        <textarea
          id="input-${k}"
          style="
            width:500px;
            height:180px;
            font-family:Consolas, monospace;
            font-size:24px;
            line-height:1.4;

            background-image:
              linear-gradient(
                to right,
                transparent 0,
                transparent calc(28.5ch),
                red calc(28.5ch),
                red calc(28.5ch + 1px),
                transparent calc(28.5ch + 1px)
              );
          "
        ></textarea>
      </div>
    `).join("");

  ["A","B","C"].forEach(k => {
    document.getElementById("input-" + k).oninput = e => {
      inputs[k] = e.target.value;
      socket.emit("typing", { key:k, value:e.target.value });
    };
  });

  updateUI();
}

function updateUI() {
  ["A","B","C"].forEach(k => {
    const label = document.getElementById("label-" + k);
    const input = document.getElementById("input-" + k);
    if (!label || !input) return;

    label.textContent = k;
    label.style.background = active === k ? "#00aa00" : "#555";
    input.readOnly = myRole !== k;

    if (k !== myRole) input.value = inputs[k] || "";
  });

  const logEl = document.getElementById("log");
  if (logEl) {
    logEl.innerHTML = log.map(l => formatLogText(l.text)).join("\n");
    logEl.scrollTop = logEl.scrollHeight;
  }
}

function send(key) {
  const text = inputs[key] || "";
  inputs[key] = "";
  document.getElementById("input-" + key).value = "";

  socket.emit("send", { key, text });
  socket.emit("typing", { key, value:"" });

  updateUI();
}

document.addEventListener("keydown", e => {
  if (e.key === "F12") {
    e.preventDefault();
    if (myRole && active === myRole) send(myRole);
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "F4") {
    e.preventDefault();

    const input = document.getElementById("input-" + myRole);
    const frame = document.getElementById("searchFrame");
    if (!input || !frame) return;

    const start = input.selectionStart;
    const end = input.selectionEnd;
    if (start === end) return;

    const text = input.value.substring(start, end);

    frame.src =
      "https://www.bing.com/search?cc=JP&setlang=ja&form=MSNVS&q=" +
      encodeURIComponent(text);
  }
});
</script>

</body>
</html>
