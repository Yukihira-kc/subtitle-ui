<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>字幕校閲 v28</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script><script src="connection.js"></script><script src="shared.js"></script><script src="pagination.js"></script><script src="caption.js"></script>
<style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap');
*{box-sizing:border-box}body{margin:18px;background:#15191f;color:#edf1f7;font-family:Meiryo,sans-serif}body.light{background:#f5f6f8;color:#111}button,select,input{font:inherit}button,select{padding:7px 12px;cursor:pointer}header,.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:23px}h2{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;margin-top:14px}.panel{border:1px solid #687583;padding:16px;min-width:0}.edit-viewport{position:relative;overflow:auto;height:330px;border:1px solid #8995a3;background:#202630}body.light .edit-viewport{background:#fff}#edit-guide{position:absolute;top:0;bottom:0;pointer-events:none;z-index:2;white-space:pre;height:100%;line-height:36px}#edit-guide span{display:inline-block;height:100%;color:transparent;border-right:2px solid #f00;white-space:pre}#edit{box-sizing:content-box;min-height:300px;padding:8px;font-size:24px;line-height:36px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-all;line-break:anywhere;outline:none;tab-size:4}#edit:empty:before{content:attr(data-placeholder);color:#8b96a5;pointer-events:none}.help{font-size:13px;color:#a8b3c3}body.light .help{color:#505c6b}#status{min-height:24px;color:#e8b35d}#capture{background:#00ff00;color:#fff;padding:8px;overflow:hidden;white-space:pre;font-size:32px;line-height:1.5;height:112px;text-shadow:1px 1px 1px #000,-1px -1px 1px #000}#capture span{display:block;height:48px}.capture-wrap{overflow:auto}.history{height:165px;overflow:auto;white-space:pre-wrap;font-size:20px;margin-top:12px}.entry{padding:8px;border-bottom:1px solid #687583}.monitor{display:flex;gap:10px;margin:9px 0}.monitor label{width:80px;font-size:14px;white-space:pre-line}.monitor textarea{background:transparent;color:inherit;width:100%;height:84px;font-size:20px;resize:vertical}.monitor.offline{opacity:.45}.monitor.active label{color:#46b965}#out{background:#a63035;color:white;border:0}a{color:#5b9ce6}#conflict{display:none}@media(max-width:1000px){.grid{grid-template-columns:1fr}}
</style><style>#capture{overflow:visible;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;height:auto;min-height:112px}#capture span{height:auto;min-height:48px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}.capture-wrap{overflow:visible}.history{overflow-wrap:anywhere;word-break:break-word}.queue{height:120px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}.queue .entry{color:#e8b35d}</style><style>
body{margin:10px;height:calc(100dvh - 20px);display:flex;flex-direction:column;overflow:hidden}header{gap:8px}h1{font-size:18px;margin:0}h2{font-size:16px;margin-bottom:8px}small{font-size:12px}.grid{flex:1;min-height:0;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,.75fr);grid-template-rows:minmax(130px,.6fr) minmax(0,1fr);gap:10px;margin-top:6px}.panel{padding:10px;display:flex;flex-direction:column;min-height:0}.editor-panel{grid-column:1;grid-row:2}.log-panel{grid-column:2;grid-row:1/3}.monitor-panel{grid-column:3;grid-row:1/3}.caption-panel{grid-column:1;grid-row:1}.queue-panel{grid-column:1;grid-row:3;display:none}.editor-panel .edit-viewport{height:auto;flex:1;min-height:80px}#edit{width:auto!important;min-height:100%;box-sizing:border-box}.history{height:auto;flex:1;min-height:0;margin:0;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}.history .entry{border:0;padding:0;line-height:1.5}.capture-wrap{overflow:auto;flex:1;min-height:0}.tools{gap:5px;margin:8px 0}button,select{padding:4px 6px}.monitor{flex:1;min-height:0;flex-direction:column;gap:3px}.monitor label{width:auto;white-space:normal}.monitor textarea{height:100%;min-height:40px;font-size:18px;resize:none;box-sizing:border-box}#monitors{flex:1;min-height:0;display:flex;flex-direction:column}.help{font-size:11px;margin:5px 0}#queue{height:100px;overflow:auto}.queue-inline{flex:0 1 120px;min-height:45px;overflow:auto;margin-top:8px}.queue-inline h2{margin:0}.entry{overflow-wrap:anywhere}
</style><style>.queue-panel{display:flex;grid-column:2;grid-row:1}.log-panel{grid-column:2;grid-row:2}#queue{flex:1;min-height:0;height:auto;overflow:auto;white-space:pre-wrap}.queue .entry{padding:6px 0;margin:0;border-bottom:1px solid #687583;line-height:1.5}.queue .entry:last-child{border-bottom:0}</style></head><body>
<header><h1>字幕校閲 <small id="version">v28</small></h1><button id="theme">白背景に切替</button><label>1行 <select id="columns"></select> 文字</label><label>字幕行数 <select id="lineCount"><option value="1">1行</option><option value="2">2行</option><option value="3">3行</option><option value="4">4行</option><option value="5">5行</option></select></label><label>表示 <select id="mode"><option value="page">ページ更新</option><option value="scroll">スクロール</option></select></label><label>背景 <input type="color" id="keyColor" value="#00ff00"></label><label>背景コード <input type="text" id="keyColorCode" value="#00FF00" inputmode="text" maxlength="7" size="8" spellcheck="false" aria-label="背景色コード"></label><label>字幕フォント <select id="captionFont"><option value="noto-sans-jp">Noto Sans JP（SIL OFL）</option><option value="noto-serif-jp">Noto Serif JP（SIL OFL）</option></select></label><label>文字色 <input type="color" id="textColor" value="#ffffff"></label><label>縁取り <select id="outline"><option value="on">あり（黒）</option><option value="off">なし</option></select></label><label>太字 <select id="fontWeight"><option value="normal">通常</option><option value="bold">太字</option></select></label><label>字幕サイズ <select id="fontSize"><option value="16">16px</option><option value="18">18px</option><option value="20">20px</option><option value="22">22px</option><option value="24">24px</option><option value="26">26px</option><option value="28">28px</option><option value="30">30px</option><option value="32">32px</option><option value="34">34px</option><option value="36">36px</option><option value="38">38px</option><option value="40">40px</option><option value="42">42px</option><option value="44">44px</option><option value="46">46px</option><option value="48">48px</option><option value="50">50px</option><option value="52">52px</option><option value="54">54px</option><option value="56">56px</option><option value="58">58px</option><option value="60">60px</option><option value="62">62px</option><option value="64">64px</option></select></label></header>
<div id="status">接続中…</div>
<main class="grid">
<section class="panel editor-panel"><h2>編集・送出</h2><div class="edit-viewport" id="edit-scroll"><div id="edit" contenteditable="true" role="textbox" aria-multiline="true" aria-label="編集・送出" spellcheck="false" data-placeholder="A・B・Cの送信内容が末尾に追加されます"></div><div id="edit-guide" aria-hidden="true"></div></div><p class="tools"><button id="send-one">1行送出 F12</button><button id="send-two">2行送出 Shift＋F12</button><button id="through-mode" type="button" aria-pressed="false">スルーモード：OFF</button><button id="out">字幕アウト</button></p><div class="help">F1取得は不要。先頭から送出し、送出確認後に削除します。</div><button id="conflict">送出済み内容を整理したので再開</button></section>
<section class="panel caption-panel"><h2>表示中字幕</h2><div class="capture-wrap"><div id="capture" aria-label="表示中字幕"><span></span><span></span></div></div><p class="help">上の単色領域をキャプチャしてください。<a href="output.html" target="_blank">字幕だけの画面を開く</a></p></section>
<section class="panel queue-panel"><h2>送信待機</h2><div id="queue" class="queue" aria-label="送信待機"></div></section>
<section class="panel log-panel"><h2>ログ</h2><div id="sent" class="history" aria-label="投影済み字幕ログ"></div></section>

<section class="panel monitor-panel"><h2>A・B・C 入力レビュー</h2><div id="monitors"></div></section>
</main><script src="reviewer.js"></script></body></html>
