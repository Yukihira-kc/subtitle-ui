<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>字幕コラボ</title>

<!-- ✅ ここ修正済み -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

</head>

<body style="background:#111;color:white;font-family:Meiryo, sans-serif">

<h1>字幕１コラボ</h1>

<div id="role-select">
  <h2>担当を選択</h2>
  <button onclick="selectRole('A')">A</button>
  <button onclick="selectRole('B')">B</button>
  <button onclick="selectRole('C')">C</button>
</div>

<div id="app" style="display:none"></div>

<script>
const socket = io("https://subtitle-server-czoz.onrender.com");

let inputs = { A:"", B:"", C:"" };
let active = "A";
let log = [];
let myRole = null;

function getOrder() {
  if (myRole === "A") return ["C","A","B"];
  if (myRole === "B") return ["A","B","C"];
  if (myRole === "C") return ["B","C","A"];
  return ["A","B","C"];
}

function initUI() {
  const app = document.getElementById("app");

  app.innerHTML = `
    <div style="display:flex; gap:40px;">
      <div id="columns"></div>

      <div>
        <h2>ログ</h2>
        <div id="log"></div>
      </div>
    </div>
  `;

  document.getElementById("columns").innerHTML =
    getOrder().map(k => `
      <div>
        <h3 id="label-${k}"></h3>

        <textarea
          id="input-${k}"
          style="
            width:500px;
            height:180px;
            font-family:'Meiryo', sans-serif;
            font-size:24px;
            line-height:1.4;

            background-image:
              linear-gradient(
                to right,
                transparent 0,
                transparent calc(15ch),
                rgba(255,0,0,0.8) calc(15ch),
                rgba(255,0,0,0.8) calc(15ch + 1px),
                transparent calc(15ch + 1px)
              ),
              linear-gradient(
                to right,
                transparent 0,
                transparent calc(15.5ch),
                rgba(255,255,0,0.8) calc(15.5ch),
                rgba(255,255,0,0.8) calc(15.5ch + 1px),
                transparent calc(15.5ch + 1px)
              );
          "
        ></textarea>

        <br>
        <button id="btn-${k}">送信</button>
      </div>
    `).join("");

  ["A","B","C"].forEach(k => {
    document.getElementById("input-" + k).oninput = (e) => {
      typing(k, e.target.value);
    };

    document.getElementById("btn-" + k).onclick = () => send(k);
  });

  updateUI();
}

function updateUI() {
  ["A","B","C"].forEach(k => {
    const label = document.getElementById("label-" + k);
    const input = document.getElementById("input-" + k);
    const btn = document.getElementById("btn-" + k);

    label.textContent =
      k +
      (myRole === k ? "（自分）" : "") +
      (active === k ? " ←送信可" : "");

    input.readOnly = myRole !== k;

    if (k !== myRole) {
      input.value = inputs[k] || "";
    } else {
      if (document.activeElement !== input) {
        input.value = inputs[k] || "";
      }
    }

    btn.disabled = !(active === k && myRole === k);
  });

  document.getElementById("log").innerHTML =
    log.map(l => `<div>[${l.key}] ${l.text}</div>`).join("");
}

function selectRole(role) {
  myRole = role;
  document.getElementById("role-select").style.display = "none";
  document.getElementById("app").style.display = "block";
  initUI();
}

function typing(key, value) {
  inputs[key] = value;
  socket.emit("typing", { key, value });
}

function send(key) {
  if (active !== key) return;

  const inputEl = document.getElementById("input-" + key);
  if (inputEl) inputEl.value = "";

  const text = inputs[key];
  inputs[key] = "";

  socket.emit("send", { key, text });
  socket.emit("typing", { key, value: "" });

  updateUI();
}

socket.on("typing", ({ key, value }) => {
  inputs[key] = value;
  updateUI();
});

socket.on("log", (data) => {
  log.unshift(data);
  updateUI();
});

socket.on("active", (next) => {
  active = next;
  updateUI();
});

// F12送信
document.addEventListener("keydown", (e) => {
  if (e.key === "F12") {
    e.preventDefault();
    if (myRole) send(myRole);
  }
});
</script>

</body>
</html>
