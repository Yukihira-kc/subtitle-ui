<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>字幕コラボ</title>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<style>
body {
  --page-bg:#111;
  --page-text:#fff;
  --border:#fff;
  --offline-bg:#2a2a2a;
  --offline-text:#777;
  --offline-border:#444;
  --label-offline-bg:#333;
  --label-bg:#555;
  --label-text:#fff;
  background:var(--page-bg);
  color:var(--page-text);
  font-family:Meiryo, monospace;
}

body.light-theme {
  --page-bg:#fff;
  --page-text:#000;
  --border:#555;
  --offline-bg:#eee;
  --offline-text:#666;
  --offline-border:#bbb;
  --label-offline-bg:#ddd;
  --label-bg:#ddd;
  --label-text:#000;
}

textarea, button {
  background-color:var(--page-bg);
  color:var(--page-text);
  border:1px solid var(--border);
}

#theme-toggle {
  margin-bottom:8px;
  padding:6px 12px;
  cursor:pointer;
}

.fixed {
  width:100%;
  max-width:496px;
  font-family:Consolas, monospace;
  font-size:24px;
  line-height:34px;
  box-sizing:border-box;
}

/* 16:9画面対応 */
html,
body {
  margin:0;
  min-height:100%;
}

body {
  padding:10px;
  overflow:hidden;
}

#app {
  width:100%;
  height:calc(100vh - 58px);
  min-height:0;
  overflow:hidden;
}

#workspace {
  display:grid;
  grid-template-columns:
    minmax(0,1.15fr)
    minmax(220px,1fr)
    minmax(220px,1fr);
  gap:12px;
  width:100%;
  height:100%;
  min-height:0;
}

#workspace > section {
  min-width:0;
  min-height:0;
  overflow:hidden;
}

#columns {
  min-width:0;
  min-height:0;
  overflow:auto;
}

#log-panel,
#search-panel {
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
}

#log,
#searchFrame {
  width:100% !important;
  max-width:none;
  min-width:0;
  height:auto !important;
  min-height:0;
  flex:1;
}

#searchFrame {
  display:block;
}

@media (max-width:1100px) {
  #workspace {
    grid-template-columns:
      minmax(0,1.2fr)
      minmax(180px,.8fr)
      minmax(180px,.8fr);
    gap:8px;
  }

  .fixed {
    font-size:clamp(16px,2vw,24px);
  }
}

@media (max-width:800px) {
  body {
    overflow:auto;
  }

  #app {
    height:auto;
    overflow:visible;
  }

  #workspace {
    grid-template-columns:1fr;
    height:auto;
  }

  #log-panel,
  #search-panel {
    height:38vh;
  }
}
</style>
</head>

<body>

<button id="theme-toggle" type="button" aria-pressed="false">
  白背景に切替
</button>

<div id="role-select">
  <h2>担当を選択</h2>
  <button id="btnA">A</button>
  <button id="btnB">B</button>
  <button id="btnC">C</button>
</div>

<div id="app" style="display:none"></div>

<script>

let socket;
let isConnected = false;
let myRole = null;

let inputs = {
  A:"",
  B:"",
  C:""
};

let active = null;

let connectedRoles = {
  A:false,
  B:false,
  C:false
};

let log = [];

window.addEventListener("DOMContentLoaded", init);

function init() {
  initTheme();
  bindRoleButtons();
  bindGlobalKeys();
}

function initTheme() {
  const button = document.getElementById("theme-toggle");

  function applyTheme(light) {
    document.body.classList.toggle("light-theme", light);
    button.textContent = light
      ? "黒背景に切替"
      : "白背景に切替";
    button.setAttribute("aria-pressed", String(light));
  }

  let light = false;

  try {
    light =
      localStorage.getItem("subtitle-collab-theme")
      === "light";
  } catch (_) {
  }

  applyTheme(light);

  button.onclick = () => {
    const next =
      !document.body.classList.contains("light-theme");

    applyTheme(next);

    try {
      localStorage.setItem(
        "subtitle-collab-theme",
        next ? "light" : "dark"
      );
    } catch (_) {
    }
  };
}

function bindRoleButtons() {
  document.getElementById("btnA").onclick = () => startApp("A");
  document.getElementById("btnB").onclick = () => startApp("B");
  document.getElementById("btnC").onclick = () => startApp("C");
}

function startApp(role) {
  myRole = role;

  document.getElementById("role-select").style.display =
    "none";

  document.getElementById("app").style.display =
    "block";

  createLayout();
  createInputs();
  setGuideLine();
  connectSocket();
}

function createLayout() {
  document.getElementById("app").innerHTML = `
    <div id="workspace">

      <section id="columns"></section>

      <section id="log-panel">
        <h3>ログ</h3>

        <div
          id="log"
          class="fixed"
          style="
            height:400px;
            overflow-y:scroll;
            border:1px solid var(--border);
            padding:4px;
            white-space:pre-wrap;
            overflow-wrap:anywhere;
          "
        ></div>
      </section>

      <section id="search-panel">
        <h3>検索（選択中テキストをF4）</h3>

        <iframe
          id="searchFrame"
          style="
            width:600px;
            height:400px;
            border:1px solid var(--border);
          "
        ></iframe>
      </section>

    </div>
  `;
}

function getOrder() {
  if (myRole === "A") return ["C","A","B"];
  if (myRole === "B") return ["A","B","C"];
  if (myRole === "C") return ["B","C","A"];

  return ["A","B","C"];
}

function createInputs() {
  const columns =
    document.getElementById("columns");

  columns.innerHTML =
    getOrder().map(k => `
      <div
        style="
          display:flex;
          gap:10px;
          margin-bottom:20px;
        "
      >
        <div
          id="label-${k}"
          style="
            width:40px;
            height:180px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#555;
            color:white;
          "
        ></div>

        <textarea
          id="input-${k}"
          class="fixed"
          style="height:180px;"
        ></textarea>
      </div>
    `).join("");

  ["A","B","C"].forEach(k => {
    document.getElementById(
      "input-" + k
    ).oninput = e => {
      inputs[k] = e.target.value;

      if (socket && isConnected) {
        socket.emit("typing", {
          key:k,
          value:e.target.value
        });
      }
    };
  });

  updateUI();
}

function setGuideLine() {
  const span = document.createElement("span");

  span.style.font = "24px Consolas";
  span.innerText = "あ".repeat(15.5);

  document.body.appendChild(span);

  const w = span.getBoundingClientRect().width;

  document.body.removeChild(span);

  document.querySelectorAll("textarea").forEach(el => {
    el.style.backgroundImage = `
      linear-gradient(
        to right,
        transparent ${w}px,
        red ${w}px,
        red ${w + 1}px,
        transparent ${w + 1}px
      )
    `;
  });
}

function connectSocket() {
  socket = io(
    "https://subtitle-server-czoz.onrender.com"
  );

  socket.on("connect", () => {
    isConnected = true;

    socket.emit("register", {
      key:myRole
    });
  });

  socket.on("disconnect", () => {
    isConnected = false;

    if (myRole) {
      connectedRoles[myRole] = false;
    }

    updateUI();
  });

  socket.on("presence", presence => {
    connectedRoles = {
      A:!!presence.A,
      B:!!presence.B,
      C:!!presence.C
    };

    ["A","B","C"].forEach(k => {
      if (k !== myRole && !connectedRoles[k]) {
        inputs[k] = "";
      }
    });

    updateUI();
  });

  socket.on("typing", ({key,value}) => {
    inputs[key] = value;
    updateUI();
  });

  socket.on("log", data => {
    log.push(data);
    updateUI();
  });

  socket.on("active", next => {
    active = next;
    updateUI();
  });
}

function updateUI() {
  ["A","B","C"].forEach(k => {
    const label =
      document.getElementById("label-" + k);

    const input =
      document.getElementById("input-" + k);

    if (!label || !input) {
      return;
    }

    const online = connectedRoles[k];

    label.textContent = k;

    if (!online) {
      label.style.background =
        "var(--label-offline-bg)";
      label.style.color =
        "var(--offline-text)";
      label.title = "未接続";

    } else if (active === k) {
      label.style.background = "#0a0";
      label.style.color = "white";
      label.title = "送信担当";

    } else {
      label.style.background =
        "var(--label-bg)";
      label.style.color =
        "var(--label-text)";
      label.title = "接続中";
    }

    input.readOnly = (
      myRole !== k ||
      !online
    );

    if (!online) {
      input.style.backgroundColor =
        "var(--offline-bg)";
      input.style.color =
        "var(--offline-text)";
      input.style.borderColor =
        "var(--offline-border)";
      input.placeholder = "未接続";

    } else {
      input.style.backgroundColor = "";
      input.style.color = "";
      input.style.borderColor = "";
      input.placeholder = "";
    }

    if (k !== myRole) {
      input.value = inputs[k] || "";
    }
  });

  const logEl =
    document.getElementById("log");

  if (!logEl) {
    return;
  }

  const nextText =
    log
      .map(l =>
        String(l.text || "")
          .replace(
            /。(?=\r\n|\r|\n|$)/g,
            "｡"
          )
      )
      .join("\n");

  const currentText =
    logEl.textContent;

  if (nextText !== currentText) {
    const selection =
      window.getSelection();

    let selectingLog = false;

    if (selection && !selection.isCollapsed) {
      for (
        let i = 0;
        i < selection.rangeCount;
        i++
      ) {
        if (
          selection
            .getRangeAt(i)
            .intersectsNode(logEl)
        ) {
          selectingLog = true;
          break;
        }
      }
    }

    const followBottom =
      !selectingLog &&
      logEl.scrollHeight -
        logEl.clientHeight -
        logEl.scrollTop <= 2;

    if (nextText.startsWith(currentText)) {
      logEl.appendChild(
        document.createTextNode(
          nextText.slice(currentText.length)
        )
      );
    } else {
      logEl.textContent = nextText;
    }

    if (followBottom) {
      logEl.scrollTop =
        logEl.scrollHeight;
    }
  }
}

function send() {
  if (!isConnected) {
    return;
  }

  if (!myRole) {
    return;
  }

  if (!connectedRoles[myRole]) {
    return;
  }

  if (active !== myRole) {
    return;
  }

  const text =
    inputs[myRole] || "";

  inputs[myRole] = "";

  document.getElementById(
    "input-" + myRole
  ).value = "";

  socket.emit("send", {
    key:myRole,
    text
  });

  socket.emit("typing", {
    key:myRole,
    value:""
  });

  updateUI();
}

function bindGlobalKeys() {
  document.addEventListener(
    "keydown",
    handleKey
  );
}

function handleKey(e) {
  if (e.key === "F12") {
    e.preventDefault();

    if (
      myRole &&
      active === myRole
    ) {
      send();
    }
  }

  if (e.key === "F4") {
    e.preventDefault();

    const input =
      document.getElementById(
        "input-" + myRole
      );

    const frame =
      document.getElementById(
        "searchFrame"
      );

    if (!input || !frame) {
      return;
    }

    const text =
      input.value.substring(
        input.selectionStart,
        input.selectionEnd
      );

    if (!text) {
      return;
    }

    frame.src =
      "https://www.bing.com/search?q=" +
      encodeURIComponent(text);
  }
}

</script>

</body>
</html>
